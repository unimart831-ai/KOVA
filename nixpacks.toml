# Nixpacks config for Railway
# Let Nixpacks auto-detect Python (from requirements.txt) and Node (from package.json)
# We only customize the build phase and start command

[phases.build]
cmds = [
    "npm install",
    "npx tailwindcss -i ./static/css/input.css -o ./static/css/output.css --minify",
    "python manage.py collectstatic --noinput",
    "python manage.py migrate --noinput"
]

[start]
cmd = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
