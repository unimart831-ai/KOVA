# Nixpacks config for Railway
# Force both Python and Node providers (package.json causes Node-only detection)
providers = ["python", "node"]

[variables]
DJANGO_SETTINGS_MODULE = "config.settings.production"

[phases.setup]
aptPkgs = [
    "fonts-dejavu-core",
    "pkg-config",
    "libcairo2-dev",
    "libpango1.0-dev",
    "libgdk-pixbuf-2.0-dev",
    "libpq-dev",
]

[phases.build]
cmds = [
    "...",
    "npm install",
    "npx tailwindcss -i ./static/css/input.css -o ./static/css/output.css --minify",
    "chmod +x start.sh"
]
