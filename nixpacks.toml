# Nixpacks config for Railway
# Force both Python and Node providers (package.json causes Node-only detection)
providers = ["python", "node"]

[variables]
DJANGO_SETTINGS_MODULE = "config.settings.production"

[phases.build]
cmds = [
    "npm install",
    "npx tailwindcss -i ./static/css/input.css -o ./static/css/output.css --minify",
    "mkdir -p staticfiles",
    "python manage.py collectstatic --noinput"
]

[start]
cmd = "python manage.py migrate --noinput; gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
