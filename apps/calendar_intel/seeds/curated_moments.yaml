# ─────────────────────────────────────────────────────────────────────────
# Curated Moments — supplements python-holidays with commercial, cultural,
# and regional days. Source of truth for Phase 1.
#
# See KOVA_HOLIDAY_AWARENESS.md §9 for schema details. Keys map 1:1 to
