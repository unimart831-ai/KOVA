- name: "Valentine's Day"
  slug: valentines-day
  short_description: "Day of romantic and platonic love."
  date_type: fixed
  date_config: { month: 2, day: 14 }
  countries: []
  category: cultural
  sensitivity_level: safe
  default_relevance_score: 75
  suggested_post_count: 2
  lead_time_days: 7
  tone_hint: warm
  industries: [retail, f_and_b, services, creative, health]
  angles:
    - "A specific gift idea that ties to your product"
    - "Behind-the-scenes love letter to your community"
    - "Pair-it offer (buy one, gift one)"
    - "Last-minute Valentine's planning rescue"
  avoid_phrases:
    - "Happy Valentine's Day to all the lovers!"
    - "Show your special someone"
    - "On this day of love"

