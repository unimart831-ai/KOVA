# Country → Religious holiday default opt-in suggestions.
# Per spec §10.3 — we never store religion as a profile field. Instead, when
# a user's country is set, we surface these religious holidays as opt-in
# choices in onboarding. The user picks; we store only the per-holiday
# preference, not the religion itself.
# ─────────────────────────────────────────────────────────────────────────

