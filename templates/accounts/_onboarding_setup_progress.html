{# Global setup progress — single onboarding screen #}
<div class="mb-8 onboarding-progress">
  <div class="flex items-center justify-between mb-2.5 gap-2">
    <span class="text-sm font-semibold text-gray-900 dark:text-white">Step {{ setup_step }} of {{ setup_total }}</span>
    {% if setup_label %}
    <span class="text-sm font-medium text-kova-700 dark:text-kova-300 text-right">{{ setup_label }}</span>
    {% endif %}
  </div>
  <div class="onboarding-progress__track" role="progressbar" aria-valuenow="{{ setup_step }}" aria-valuemin="1" aria-valuemax="{{ setup_total }}">
    <div class="onboarding-progress__fill"
         style="width: {% widthratio setup_step setup_total 100 %}%"></div>
  </div>
</div>
