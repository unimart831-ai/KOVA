{# Lazy-loaded operations report — fetched via HTMX when scrolled into view #}
<div id="operations-report-panel"
     hx-get="{% url 'brief:operations_report' %}"
     hx-trigger="intersect once"
     hx-swap="innerHTML">
  <div class="card animate-pulse border-gray-200 dark:border-gray-700">
    <div class="px-6 py-8 flex items-center gap-3">
      <div class="w-5 h-5 rounded-full bg-gray-200 dark:bg-gray-700"></div>
      <div class="h-4 flex-1 max-w-xs rounded bg-gray-200 dark:bg-gray-700"></div>
    </div>
  </div>
</div>
