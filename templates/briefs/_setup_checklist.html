{# ── Compact setup progress bar ── #}
{% if setup_checklist %}
<div class="rounded-xl border border-kova-800/60 bg-gray-900/60 px-5 py-3 flex items-center gap-4">
  <span class="text-sm font-medium text-white whitespace-nowrap">🚀 Setup</span>

  {% if setup_checklist.next_step %}
    <a href="{% url setup_checklist.next_step.url_name %}" class="text-xs text-kova-400 hover:text-kova-300 transition-colors whitespace-nowrap">
      Next: {{ setup_checklist.next_step.label }} →
    </a>
  {% endif %}

  <div class="flex-1 bg-gray-700 rounded-full h-2 min-w-[80px]">
    <div class="bg-kova-500 h-2 rounded-full transition-all duration-500" style="width: {{ setup_checklist.percent }}%"></div>
  </div>

  <span class="text-xs font-medium text-kova-400 whitespace-nowrap">{{ setup_checklist.completed }}/{{ setup_checklist.total }}</span>
</div>
{% endif %}
