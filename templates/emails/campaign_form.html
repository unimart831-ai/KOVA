{% extends "layouts/app.html" %}

{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="card p-6">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          {{ field.label }}
          {% if field.help_text %}<span class="text-xs text-gray-400 font-normal ml-1">{{ field.help_text }}</span>{% endif %}
        </label>
        {{ field }}
        {% if field.errors %}
        <p class="text-xs text-red-500 mt-0.5">{{ field.errors.0 }}</p>
        {% endif %}
      </div>
      {% endfor %}
      <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="btn-primary py-2 px-6">
          {% if is_edit %}Update Campaign{% else %}Create Campaign{% endif %}
        </button>
        {% if is_edit %}
        <a href="{% url 'emails:campaign_detail' campaign_id=campaign.pk %}" class="text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">Cancel</a>
        {% else %}
        <a href="{% url 'emails:campaigns' %}" class="text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">Cancel</a>
        {% endif %}
      </div>
    </form>
  </div>
</div>
{% endblock %}
