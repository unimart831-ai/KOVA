{% extends "layouts/app.html" %}

{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="card p-6">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
        <p class="text-xs text-red-500 mt-0.5">{{ field.errors.0 }}</p>
        {% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn-primary w-full py-2">Save</button>
    </form>
  </div>
</div>
{% endblock %}
