{# Legal / policy page header — marketing dark canvas #}
<div class="">
  <div class="relative mx-auto max-w-3xl px-5 sm:px-6 lg:px-8 py-12 sm:py-16">
    <nav class="mb-6 flex items-center gap-2 text-sm text-white/50" aria-label="Breadcrumb">
      <a href="{% url 'landing' %}" class="transition-colors hover:text-kova-400">Home</a>
      <svg class="h-3.5 w-3.5 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      <span class="font-medium text-white/80">{{ page_title }}</span>
    </nav>
    <h1 class="font-serif text-3xl font-bold tracking-[-0.03em] text-white sm:text-4xl">{{ page_title }}</h1>
    {% if page_subtitle %}<p class="mt-3 font-sans text-sm font-light text-white/55">{{ page_subtitle }}</p>{% endif %}
  </div>
</div>
