<section class="kc-hub-section" aria-label="Contact">
  <div class="kc-hub-card">
    {% include "products/public/_shop_section_head.html" with section_title="Send an enquiry" section_sub=five_questions.how_to_buy %}
    <p style="margin:0 0 1rem;font-size:0.85rem;color:var(--kc-muted)">{{ five_questions.what_after }}</p>
    <form id="contact-form" method="post" action="{% url 'kova_page:contact' slug=profile.page_slug %}">
      {% csrf_token %}
      <div class="shop-kova-form-fields">
        <div class="shop-field">
          <input type="text" name="name" placeholder="Your name *" required>
        </div>
        <div class="shop-field">
          <input type="tel" name="phone" placeholder="WhatsApp / phone number">
        </div>
        <div class="shop-field">
          <input type="email" name="email" placeholder="Email (optional)">
        </div>
        <div class="shop-field">
          <textarea name="message" placeholder="What are you looking for?" rows="3"></textarea>
        </div>
        <button type="submit" class="shop-btn shop-btn--primary shop-btn--lg">Send enquiry</button>
      </div>
    </form>
    <div id="contact-success" hidden style="margin-top:1rem;text-align:center;font-weight:600;color:var(--kc-accent)">
      Message sent — we'll be in touch soon.
    </div>
  </div>
</section>
