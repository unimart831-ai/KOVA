{% if featured_products %}
<section class="kc-hub-section" aria-label="Best sellers">
  {% include "products/public/_shop_section_head.html" with section_title="Best sellers" %}
  <div class="shop-grid shop-product-grid" role="list">
    {% for product in featured_products %}
    {% if product.commerce_slug %}
    {% include "products/public/_shop_product_card.html" %}
    {% endif %}
    {% endfor %}
  </div>
</section>
{% endif %}
