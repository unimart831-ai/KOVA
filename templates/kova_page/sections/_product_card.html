<a href="{% if product.commerce_slug %}/shop/{{ profile.page_slug }}/{{ product.commerce_slug }}/{% elif wa_url %}{{ wa_url }}{% else %}#{% endif %}"
   class="block rounded-2xl overflow-hidden bg-white shadow-sm border border-gray-100 hover:border-kova-300 transition-colors">
  {% if product.cover_image_url %}
  <img src="{{ product.cover_image_url }}" alt="{{ product.name }}" class="w-full aspect-square object-cover">
  {% else %}
  <div class="w-full aspect-square bg-gray-100 flex items-center justify-center text-gray-300 text-3xl">🛍️</div>
  {% endif %}
  <div class="p-3">
    <p class="text-sm font-semibold text-gray-900 truncate">{{ product.name }}</p>
    {% if product.display_price %}<p class="text-sm text-kova-600 font-medium mt-0.5">{{ product.display_price }}</p>{% endif %}
  </div>
</a>
