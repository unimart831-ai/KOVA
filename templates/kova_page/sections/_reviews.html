{% if testimonials %}
<section class="kc-hub-section" aria-label="Reviews">
  {% include "products/public/_shop_section_head.html" with section_title="What customers say" %}
  <div class="kc-testimonials-grid">
    {% for r in testimonials %}
    <blockquote class="kc-testimonial-card">
      <p class="kc-testimonial-quote">"{{ r.response_text|truncatewords:40 }}"</p>
      {% if r.customer_name %}<cite class="kc-testimonial-author">— {{ r.customer_name }}</cite>{% endif %}
    </blockquote>
    {% endfor %}
  </div>
</section>
{% endif %}
