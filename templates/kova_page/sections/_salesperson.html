<section class="kc-hub-section" aria-label="Ask our assistant">
  <div class="kc-hub-card">
    {% include "products/public/_shop_section_head.html" with section_title="Ask our assistant" section_sub=five_questions.whats_best %}
    <div id="ask-log" class="kc-hub-chat-log" aria-live="polite"></div>
    <form id="ask-form" class="kc-hub-ask-row">
      <input id="ask-input" class="offer-field" type="text" autocomplete="off" maxlength="500"
             placeholder="e.g. What do you recommend for…?">
      <button type="submit" class="shop-btn shop-btn--primary shop-btn--sm">Ask</button>
    </form>
  </div>
</section>
