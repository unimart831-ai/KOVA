{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message sent — {{ profile.company_name|default:"Kova" }}</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans">
  <div class="max-w-sm mx-auto px-6 text-center space-y-4">
    <div class="text-5xl">✅</div>
    <h1 class="text-xl font-bold text-gray-900">Message sent!</h1>
    <p class="text-gray-500 text-sm">
      Thanks{% if name %}, {{ name }}{% endif %}. We'll get back to you shortly.
    </p>
    <a href="{% url 'kova_page:page' slug=profile.page_slug %}"
       class="inline-block mt-2 text-kova-600 text-sm hover:underline">← Back to page</a>
  </div>
</body>
</html>
