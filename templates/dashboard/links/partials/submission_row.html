<li id="sub-{{ sub.pk }}" class="px-6 py-4">
  <div class="flex items-start justify-between">
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <p class="text-sm font-medium text-gray-900 dark:text-white">
          {{ sub.name|default:"(no name)" }}
        </p>
        <span class="text-xs text-gray-400">{{ sub.submitted_at|timesince }} ago</span>
      </div>
      <p class="text-sm text-gray-600 dark:text-gray-300 mt-0.5">{{ sub.email }}</p>
      {% if sub.phone %}
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">{{ sub.phone }}</p>
      {% endif %}
      {% if sub.message %}
      <p class="text-sm text-gray-600 dark:text-gray-300 mt-2 whitespace-pre-line">{{ sub.message }}</p>
      {% endif %}
      <p class="text-[10px] text-gray-400 mt-1">{{ sub.form.title }} · /k/{{ sub.page_slug }}/</p>
    </div>
    <div class="flex-shrink-0 ml-4">
      <span class="text-xs text-gray-400">Read</span>
    </div>
  </div>
</li>
