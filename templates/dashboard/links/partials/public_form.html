<form method="post"
      action="/k/{{ page.slug }}/form/{{ active_form.pk }}/"
      hx-post="/k/{{ page.slug }}/form/{{ active_form.pk }}/"
      hx-target="#kova-form-container"
      hx-swap="innerHTML"
      class="space-y-4">
  {% csrf_token %}
  {% for field in form_instance %}
  <div>
    <label for="{{ field.id_for_label }}" class="block text-sm font-medium mb-1" style="color: {{ page.text_color }}">{{ field.label }}</label>
    {{ field }}
    {% if field.errors %}
    <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
    {% endif %}
  </div>
  {% endfor %}
  <button type="submit"
          class="w-full py-3 px-4 rounded-xl font-semibold text-white transition-all hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2"
          style="background-color: {{ page.accent_color }}; focus:ring-color: {{ page.accent_color }}">
    {{ active_form.button_text }}
  </button>
</form>
