{# WhatsApp section tabs — V1 keeps Inbox + Status + Templates #}
<div class="subnav-tabs mb-4">
  <a href="{% url 'whatsapp:inbox' %}"
     class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if request.resolver_match.url_name == 'inbox' or request.resolver_match.url_name == 'conversation' %}border-kova-600 text-kova-600 dark:border-kova-400 dark:text-kova-400{% else %}border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300{% endif %}">
    Inbox
  </a>
  {% if request.plan_limits.whatsapp_enabled and kova_features.whatsapp_status %}
  <a href="{% url 'whatsapp:status_studio' %}"
     class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if 'status' in request.resolver_match.url_name %}border-kova-600 text-kova-600 dark:border-kova-400 dark:text-kova-400{% else %}border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300{% endif %}">
    Status
  </a>
  {% endif %}
  {% if request.plan_limits.whatsapp_enabled %}
  <a href="{% url 'whatsapp:template_list' %}"
     class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if 'template' in request.resolver_match.url_name %}border-kova-600 text-kova-600 dark:border-kova-400 dark:text-kova-400{% else %}border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300{% endif %}">
    Templates
  </a>
  {% endif %}
</div>
