{# Horizontal scroll row for posts from the same generation round #}
<div class="post-carousel-row" role="region" aria-label="Post carousel">
  <div class="post-carousel-track">
    {% for post in posts %}
      <div class="post-carousel-item">
        {% include "components/post_card.html" with post=post compact_card=compact_card show_angle=show_angle %}
      </div>
    {% endfor %}
  </div>
</div>
