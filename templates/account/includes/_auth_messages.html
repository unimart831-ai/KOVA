{% load nav_tags %}
{% if messages %}
  <div class="space-y-2 mb-4 mt-5">
    {% for message in messages|dedupe_messages %}
      <div class="rounded-xl px-4 py-3 text-sm {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% elif message.tags == 'warning' %}bg-amber-50 border border-amber-200 text-amber-800{% else %}bg-kova-50 border border-kova-200 text-kova-800{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
