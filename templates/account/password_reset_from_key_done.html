{% extends "layouts/marketing.html" %}

{% block title %}Password Changed — Kova Agent{% endblock %}

{% block content %}
<div class="brand-atmosphere min-h-[60vh] flex items-center justify-center py-12 px-4">
  {% include "components/brand/_atmosphere_orbs.html" %}
  <div class="relative w-full max-w-md text-center reveal">
    <div class="glass-panel rounded-2xl p-8">
      <div class="w-16 h-16 rounded-2xl bg-growth-100 dark:bg-growth-900/30 flex items-center justify-center mx-auto mb-6">
        <svg class="w-8 h-8 text-growth-600 dark:text-growth-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-3">Password updated</h1>
      <p class="text-gray-600 dark:text-gray-400 mb-8">Your password has been successfully changed.</p>
      <a href="{% url 'account_login' %}" class="btn-primary inline-flex">Sign in with new password</a>
    </div>
  </div>
</div>
{% endblock %}
