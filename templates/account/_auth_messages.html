{% load nav_tags %}
{% if messages %}
  <div class="space-y-2 mb-4">
    {% for message in messages|dedupe_messages %}
      <div class="rounded-lg px-4 py-3 text-sm {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700 dark:bg-red-950/30 dark:border-red-800 dark:text-red-200{% elif message.tags == 'warning' %}bg-amber-50 border border-amber-200 text-amber-800 dark:bg-amber-950/30 dark:border-amber-800 dark:text-amber-200{% else %}bg-emerald-50 border border-emerald-200 text-emerald-800 dark:bg-emerald-950/30 dark:border-emerald-800 dark:text-emerald-200{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
