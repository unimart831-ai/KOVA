{% load nav_tags %}
{% if messages %}
  <div class="space-y-2 mb-4">
    {% for message in messages|dedupe_messages %}
      <div class="rounded-lg px-4 py-3 text-sm {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700 dark:bg-red-950/30 dark:border-red-800 dark:text-red-200{% elif message.tags == 'warning' %}bg-gold-50 border border-gold-200 text-gold-800 dark:bg-gold-950/30 dark:border-gold-800 dark:text-gold-200{% else %}bg-growth-50 border border-growth-200 text-growth-800 dark:bg-growth-950/30 dark:border-growth-800 dark:text-growth-200{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
