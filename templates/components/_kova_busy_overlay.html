{# Global "Kova is working" overlay — shown after ~2s on slow loads #}
<div id="kova-busy-overlay"
     class="fixed inset-0 z-[9998] flex items-center justify-center p-4 pointer-events-none opacity-0 transition-opacity duration-300"
     role="status"
     aria-live="polite"
     aria-busy="false"
     aria-hidden="true"
     x-data="kovaBusyOverlay()"
     x-init="init()"
     x-show="open"
     x-cloak
     :class="open ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'"
     @kova:busy:show.window="show($event.detail)"
     @kova:busy:message.window="setMessage($event.detail)"
     @kova:busy:hide.window="hide()">
  <div class="absolute inset-0 bg-gray-950/55 backdrop-blur-sm" aria-hidden="true"></div>

  <div class="relative w-full max-w-sm rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 shadow-2xl px-6 py-7 text-center kova-busy-card">
    <div class="relative mx-auto w-14 h-14 mb-4">
      <div class="absolute inset-0 rounded-2xl bg-kova-100 dark:bg-kova-950/80 kova-busy-orb"></div>
      <div class="relative w-14 h-14 rounded-2xl bg-kova-600 dark:bg-kova-500 flex items-center justify-center shadow-kova">
        <span class="text-white font-bold text-lg font-display">K</span>
      </div>
    </div>

    <p class="text-base font-bold text-gray-900 dark:text-white font-display">Kova is working</p>
    <p class="mt-2 text-sm text-gray-600 dark:text-gray-300 min-h-[2.5rem] transition-opacity duration-300"
       x-text="message"
       x-show="message"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 translate-y-1"
       x-transition:enter-end="opacity-100 translate-y-0"></p>

    <div class="flex justify-center gap-1.5 mt-5" aria-hidden="true">
      <span class="w-2 h-2 rounded-full bg-kova-400 animate-bounce" style="animation-delay:0ms"></span>
      <span class="w-2 h-2 rounded-full bg-kova-500 animate-bounce" style="animation-delay:150ms"></span>
      <span class="w-2 h-2 rounded-full bg-kova-400 animate-bounce" style="animation-delay:300ms"></span>
    </div>
  </div>
</div>

<script>
document.addEventListener("alpine:init", function () {
  Alpine.data("kovaBusyOverlay", function () {
    return {
      open: false,
      message: "Your AI team is on it…",

      init: function () {},

      show: function (detail) {
        this.message = (detail && detail.message) || "Your AI team is on it…";
        this.open = true;
        var root = document.getElementById("kova-busy-overlay");
        if (root) {
          root.setAttribute("aria-busy", "true");
          root.setAttribute("aria-hidden", "false");
        }
      },

      setMessage: function (detail) {
        if (!this.open) return;
        this.message = (detail && detail.message) || this.message;
      },

      hide: function () {
        this.open = false;
        var root = document.getElementById("kova-busy-overlay");
        if (root) {
          root.setAttribute("aria-busy", "false");
          root.setAttribute("aria-hidden", "true");
        }
      },
    };
  });
});
</script>
