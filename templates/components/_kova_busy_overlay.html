{# Slim top progress bar — opt-in via data-kova-busy="on|instant" only #}
<div id="kova-busy-overlay"
     class="fixed top-0 left-0 right-0 z-[9998] pointer-events-none opacity-0 transition-opacity duration-200"
     role="status"
     aria-live="polite"
     aria-busy="false"
     aria-hidden="true"
     x-data="kovaBusyOverlay()"
     x-init="init()"
     x-show="open"
     x-cloak
     :class="open ? 'opacity-100' : 'opacity-0'"
     @kova:busy:show.window="show($event.detail)"
     @kova:busy:hide.window="hide()">
  <div class="h-1 w-full bg-gray-200/80 dark:bg-gray-800/80 overflow-hidden" aria-hidden="true">
    <div class="h-full w-1/3 bg-kova-500 dark:bg-kova-400 animate-kova-busy-bar rounded-r-full"></div>
  </div>
  <p class="sr-only" x-text="message || 'Loading'"></p>
</div>

<script>
document.addEventListener("alpine:init", function () {
  Alpine.data("kovaBusyOverlay", function () {
    return {
      open: false,
      message: "",

      init: function () {},

      show: function (detail) {
        this.message = (detail && detail.message) || "";
        this.open = true;
        var root = document.getElementById("kova-busy-overlay");
        if (root) {
          root.setAttribute("aria-busy", "true");
          root.setAttribute("aria-hidden", "false");
        }
      },

      hide: function () {
        this.open = false;
        this.message = "";
        var root = document.getElementById("kova-busy-overlay");
        if (root) {
          root.setAttribute("aria-busy", "false");
          root.setAttribute("aria-hidden", "true");
        }
      },
    };
  });
});
</script>
