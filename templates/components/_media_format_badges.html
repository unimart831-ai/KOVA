{# Format badges from a MediaPlan — {% media_plan_badges media_plan %} #}
{% if has_plan %}
<div class="flex flex-wrap gap-1.5">
  {% for fmt in formats %}
  <span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300">{{ fmt }}</span>
  {% endfor %}
  {% if reel_label %}
  <span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-orange-50 dark:bg-orange-950/40 text-orange-700 dark:text-orange-300">{{ reel_label }}</span>
  {% endif %}
  {% if carousel_label %}
  <span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-purple-50 dark:bg-purple-950/40 text-purple-700 dark:text-purple-300">{{ carousel_label }}</span>
  {% endif %}
</div>
{% endif %}
