{# North-star loop — visible on core surfaces. Requires kova_voice context processor. #}
<div class="rounded-xl border border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/60 px-3 py-2.5 overflow-x-auto">
  <p class="text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">{{ kova_north_star }}</p>
  <ol class="flex items-center gap-1 min-w-max text-[10px] sm:text-xs text-gray-600 dark:text-gray-300" aria-label="Kova daily loop">
    {% for label, hint in kova_loop_steps %}
    <li class="flex items-center gap-1">
      <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-kova-100 dark:bg-kova-900/50 text-kova-700 dark:text-kova-300 font-bold text-[9px]" title="{{ hint }}">{{ forloop.counter }}</span>
      <span class="font-medium whitespace-nowrap">{{ label }}</span>
      {% if not forloop.last %}
      <svg class="w-3 h-3 text-gray-300 dark:text-gray-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      {% endif %}
    </li>
    {% endfor %}
  </ol>
  <p class="text-[10px] text-gray-400 dark:text-gray-500 mt-1.5 hidden sm:block">{{ kova_approve_first }}</p>
</div>
