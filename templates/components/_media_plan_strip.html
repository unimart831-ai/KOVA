{# Product detail — planned formats from BusinessAsset media_plan #}
{% load media_extras %}
{% if media_plan and media_plan.formats %}
<div class="rounded-lg border border-indigo-100 dark:border-indigo-900/50 bg-indigo-50/50 dark:bg-indigo-950/20 px-4 py-3">
  <p class="text-[10px] font-semibold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">Planned formats</p>
  {% media_plan_badges media_plan %}
  {% if media_plan.rationale %}
  <p class="text-xs text-gray-600 dark:text-gray-400 mt-2">{{ media_plan.rationale }}</p>
  {% endif %}
</div>
{% endif %}
