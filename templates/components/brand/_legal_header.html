{# Legal / policy page header with brand atmosphere #}
<div class="brand-atmosphere border-b border-gray-100 dark:border-gray-800">
  {% include "components/brand/_atmosphere_orbs.html" %}
  <div class="relative max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
    <nav class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 mb-6 reveal">
      <a href="/" class="hover:text-kova-600 dark:hover:text-kova-400 transition-colors">Home</a>
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      <span class="text-gray-900 dark:text-white font-medium">{{ page_title }}</span>
    </nav>
    <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white reveal reveal-delay-1">{{ page_title }}</h1>
    {% if page_subtitle %}<p class="text-sm text-gray-500 dark:text-gray-400 mt-3 reveal reveal-delay-2">{{ page_subtitle }}</p>{% endif %}
  </div>
</div>
