{# Four-step value strip — before explaining machinery #}
<div class="mt-8 max-w-3xl mx-auto reveal reveal-delay-3">
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
    {% for label, hint in marketing_hero_strip %}
    <div class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white/80 dark:bg-gray-900/60 px-3 py-3 text-center" title="{{ hint }}">
      <p class="text-sm font-bold text-gray-900 dark:text-white">{{ label }}</p>
      <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-0.5 hidden sm:block">{{ hint }}</p>
    </div>
    {% endfor %}
  </div>
</div>
