{# Four-step value strip — compact row under hero CTA #}
<div class="mt-10 reveal reveal-delay-4">
  <div class="grid grid-cols-2 gap-3 max-w-lg">
    {% for label, hint in marketing_hero_strip %}
    <div class="rounded-xl border border-gray-200/80 dark:border-gray-700 bg-white/80 dark:bg-gray-800/80 px-3 py-3" title="{{ hint }}">
      <p class="text-sm font-semibold text-gray-900 dark:text-gray-50">{{ label }}</p>
      <p class="text-[11px] text-gray-500 dark:text-gray-400 mt-0.5">{{ hint }}</p>
    </div>
    {% endfor %}
  </div>
</div>
