{# Outcome capabilities — not agent names #}
<section class="py-20 marketing-section-muted">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-14 reveal">
      <h2 class="text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white">What Kova does for you</h2>
      <p class="mt-4 text-lg text-gray-600 dark:text-gray-400 max-w-2xl mx-auto">
        A full marketing team behind the scenes — you only touch approve, reply, and count the money.
      </p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      {% for title, body in outcome_capabilities %}
      <div class="marketing-card p-6 sm:p-8 reveal {% if forloop.counter == 6 %}border-2 border-growth-200 dark:border-growth-800{% endif %}">
        <h3 class="text-lg font-bold text-gray-900 dark:text-white">{{ title }}</h3>
        <p class="mt-2 text-sm text-gray-600 dark:text-gray-400 leading-relaxed">{{ body }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
