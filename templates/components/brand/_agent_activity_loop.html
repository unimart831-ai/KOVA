{# Agent activity feed — static list on mobile; gentle highlight cycle on desktop when motion allowed #}
<div class="glass-panel p-4 sm:p-5 space-y-3"
     x-data="{
       items: [
         { icon: 'research', text: 'Research Agent found 3 trending topics in your niche', color: 'blue' },
         { icon: 'create', text: 'Content Creator drafted 2 posts in your brand voice', color: 'purple' },
         { icon: 'adapt', text: 'Platform Adapter tailored posts for X, LinkedIn & Instagram', color: 'green' },
         { icon: 'engage', text: 'Engage Agent drafted replies to 8 comments', color: 'amber' },
         { icon: 'analyze', text: 'Analytics Agent: engagement up 23% this week', color: 'rose' },
         { icon: 'learn', text: 'Adapt Agent refined your voice from performance data', color: 'kova' }
       ],
       active: 0,
       motionOk: !window.matchMedia('(prefers-reduced-motion: reduce)').matches,
       init() {
         if (!this.motionOk) return;
         setInterval(() => { this.active = (this.active + 1) % this.items.length }, 4500);
       }
     }">
  <p class="text-[10px] font-semibold uppercase tracking-wider text-kova-600 dark:text-kova-400">Live agent loop</p>
  <template x-for="(item, i) in items" :key="i">
    <div class="flex items-center gap-3 py-2 px-3 rounded-lg transition-colors duration-300"
         :class="motionOk && active === i ? 'bg-white dark:bg-gray-800/90 shadow-sm border border-kova-200/60 dark:border-kova-800/60' : (motionOk ? 'opacity-40 border border-transparent' : 'border border-gray-100 dark:border-gray-800/60')">
      <div class="w-7 h-7 rounded-md flex items-center justify-center flex-shrink-0"
           :class="{
             'bg-blue-100 dark:bg-blue-950/50': item.color === 'blue',
             'bg-kova-100 dark:bg-kova-950/50': item.color === 'purple',
             'bg-growth-100 dark:bg-growth-950/50': item.color === 'green',
             'bg-gold-100 dark:bg-gold-950/50': item.color === 'amber',
             'bg-rose-100 dark:bg-rose-950/50': item.color === 'rose',
             'bg-kova-100 dark:bg-kova-950/50': item.color === 'kova'
           }">
        <svg x-show="item.icon === 'research'" class="w-3.5 h-3.5 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <svg x-show="item.icon === 'create'" class="w-3.5 h-3.5 text-kova-600 dark:text-kova-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        <svg x-show="item.icon === 'adapt'" class="w-3.5 h-3.5 text-growth-600 dark:text-growth-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
        <svg x-show="item.icon === 'engage'" class="w-3.5 h-3.5 text-gold-600 dark:text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <svg x-show="item.icon === 'analyze'" class="w-3.5 h-3.5 text-rose-600 dark:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <svg x-show="item.icon === 'learn'" class="w-3.5 h-3.5 text-kova-600 dark:text-kova-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </div>
      <span class="text-xs text-gray-700 dark:text-gray-300 leading-snug" x-text="item.text"></span>
    </div>
  </template>
</div>
