{# Business types — product / service / professional #}
<section class="py-16 marketing-section-default">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center reveal">
    <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">Built for how you actually sell</h2>
    <p class="mt-3 text-gray-600 dark:text-gray-400 max-w-xl mx-auto">Retail shops, salons, restaurants, agencies, consultants — one loop, tuned to your business.</p>
    <div class="mt-8 flex flex-wrap justify-center gap-2">
      {% for title, detail in built_for_types %}
      <span class="inline-flex flex-col items-start text-left px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm" title="{{ detail }}">
        <span class="font-semibold text-gray-900 dark:text-white">{{ title }}</span>
        <span class="text-[10px] text-gray-500 dark:text-gray-400 mt-0.5">{{ detail }}</span>
      </span>
      {% endfor %}
    </div>
  </div>
</section>
