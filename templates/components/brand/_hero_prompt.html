{# Nas-style hero prompt — stores hint in session via landing_start, then signup #}
<form method="post" action="{% url 'landing_start' %}" class="hero-prompt reveal reveal-delay-3 max-w-2xl mx-auto">
  {% csrf_token %}
  <div class="hero-prompt-inner">
    <input type="text"
           name="business_hint"
           maxlength="280"
           autocomplete="off"
           class="hero-prompt-input"
           placeholder="I run a boutique in Nairobi and want more Instagram sales…"
           aria-label="Describe your business">
    <button type="submit" class="hero-prompt-btn" aria-label="Start free trial">
      <span class="sm:hidden">Start free</span>
      <span class="hidden sm:inline">Connect WhatsApp — free trial</span>
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
      </svg>
    </button>
  </div>
</form>
<p class="mt-4 text-sm text-gray-500 dark:text-gray-400 reveal reveal-delay-4">
  No credit card · 7-day Starter trial · From KSh {{ all_plans.starter.price_kes }}/mo
  <span class="hidden sm:inline"> · </span>
  <a href="#how-it-works" class="text-kova-600 dark:text-kova-400 hover:underline font-medium">See how it works</a>
</p>
