{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var k = "kova-theme";
        var s = localStorage.getItem(k);
        var dark = s === "dark" || (s !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <title>{% block title %}Kova Agent{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}6 AI agents create content, reply to comments, and optimize your timing — you approve in 5 minutes. From KSh 99/mo.{% endblock %}">

  <!-- PWA -->
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kova Agent">

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="{% static 'css/output.css' %}">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>

  <!-- Alpine.js + Intersect plugin -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3/dist/cdn.min.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>

  <!-- HTMX config -->
  <meta name="htmx-config" content='{"getCsrfToken": true}'>

  {% block extra_head %}{% endblock %}
</head>
<body class="h-full {% block body_class %}{% endblock %}"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

  {% block body %}{% endblock %}

  <!-- Notifications (toast) -->
  <div id="notifications"
       class="fixed top-4 right-4 z-50 space-y-2"
       x-data="{ toasts: [] }"
       @notify.window="toasts.push({message: $event.detail.message, type: $event.detail.type || 'info', id: Date.now()}); setTimeout(() => toasts.shift(), 4000)">
    <template x-for="toast in toasts" :key="toast.id">
      <div x-show="true"
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 translate-x-8"
           x-transition:enter-end="opacity-100 translate-x-0"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100"
           x-transition:leave-end="opacity-0"
           :class="{
             'bg-green-50 border-green-400 text-green-800 dark:bg-green-950 dark:border-green-700 dark:text-green-200': toast.type === 'success',
             'bg-red-50 border-red-400 text-red-800 dark:bg-red-950 dark:border-red-700 dark:text-red-200': toast.type === 'error',
             'bg-blue-50 border-blue-400 text-blue-800 dark:bg-blue-950 dark:border-blue-700 dark:text-blue-200': toast.type === 'info',
             'bg-yellow-50 border-yellow-400 text-yellow-800 dark:bg-yellow-950 dark:border-yellow-700 dark:text-yellow-200': toast.type === 'warning'
           }"
           class="px-4 py-3 rounded-lg border shadow-lg text-sm font-medium max-w-sm animate-slide-in-right">
        <span x-text="toast.message"></span>
      </div>
    </template>
  </div>

  {% block extra_js %}{% endblock %}

  <!-- Service Worker registration -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    }
  </script>
</body>
</html>
