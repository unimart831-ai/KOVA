<div class="subnav-tabs">
  <a href="{% url 'products:list' %}"
     class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if request.resolver_match.url_name == 'list' %}border-kova-600 text-kova-600 dark:border-kova-400 dark:text-kova-400{% else %}border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 hover:border-gray-300 dark:hover:border-gray-600{% endif %}">
    Catalog
  </a>
  <a href="{% url 'products:snap' %}"
     class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if 'snap' in request.resolver_match.url_name %}border-purple-600 text-purple-600 dark:border-purple-400 dark:text-purple-400{% else %}border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 hover:border-gray-300 dark:hover:border-gray-600{% endif %}">
    Snap to Sell
  </a>
  <a href="{% url 'products:restock' %}"
     class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if 'restock' in request.resolver_match.url_name %}border-orange-600 text-orange-600 dark:border-orange-400 dark:text-orange-400{% else %}border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 hover:border-gray-300 dark:hover:border-gray-600{% endif %}">
    Receipt to Restock
  </a>
  <a href="{% url 'products:categories' %}"
     class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors {% if 'categor' in request.resolver_match.url_name %}border-kova-600 text-kova-600 dark:border-kova-400 dark:text-kova-400{% else %}border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 hover:border-gray-300 dark:hover:border-gray-600{% endif %}">
    Categories
  </a>
  <a href="{% url 'products:alerts' %}"
     class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors flex items-center gap-1.5 {% if 'alert' in request.resolver_match.url_name %}border-amber-600 text-amber-600 dark:border-amber-400 dark:text-amber-400{% else %}border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 hover:border-gray-300 dark:hover:border-gray-600{% endif %}">
    Alerts
    {% if unread_alerts %}
    <span class="inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1 rounded-full text-[10px] font-bold bg-amber-500 text-white">{{ unread_alerts }}</span>
    {% endif %}
  </a>
</div>
