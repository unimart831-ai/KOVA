{# Side promo card for marketplace hero grid #}
<a href="{% url 'public_commerce' page_slug=shop_slug commerce_slug=product.commerce_slug %}"
   class="shop-hero-promo-card">
  <div class="shop-hero-promo-media">
    {% with hero=product.shop_hero_image_url %}
    {% if hero %}
    <img src="{{ hero }}" alt="{{ product.name }}" loading="lazy">
    {% else %}
    <div class="shop-placeholder" aria-hidden="true">{{ product.name|slice:":1"|upper }}</div>
    {% endif %}
    {% endwith %}
    {% if product.is_featured %}
    <span class="shop-hero-promo-ad">AD</span>
    {% endif %}
  </div>
  <div class="shop-hero-promo-footer">
    <span class="shop-hero-promo-name">{{ product.name }}</span>
    <span class="shop-hero-promo-cta" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </span>
  </div>
</a>
