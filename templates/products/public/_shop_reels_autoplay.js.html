<script>
(function () {
  var videos = document.querySelectorAll('.reel-video, .product-reel-video');
  if (!videos.length) return;

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var video = entry.target;
        if (entry.isIntersecting) {
          var playPromise = video.play();
          if (playPromise && playPromise.catch) playPromise.catch(function () {});
        } else {
          video.pause();
        }
      });
    }, { root: null, threshold: 0.35 });
    videos.forEach(function (video) { observer.observe(video); });
  }

  function muteAllExcept(active) {
    document.querySelectorAll('.reel-video').forEach(function (video) {
      if (video !== active) video.muted = true;
    });
    document.querySelectorAll('.reel-sound-btn').forEach(function (btn) {
      var cardVideo = btn.closest('.reel-card') && btn.closest('.reel-card').querySelector('.reel-video');
      var on = cardVideo && !cardVideo.muted;
      btn.textContent = on ? '🔊' : '🔇';
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  document.querySelectorAll('.reel-sound-btn').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var card = btn.closest('.reel-card');
      var video = card && card.querySelector('.reel-video');
      if (!video) return;
      if (video.muted) {
        muteAllExcept(video);
        video.muted = false;
        btn.textContent = '🔊';
        btn.setAttribute('aria-pressed', 'true');
      } else {
        video.muted = true;
        btn.textContent = '🔇';
        btn.setAttribute('aria-pressed', 'false');
      }
      video.play().catch(function () {});
    });
  });

  var productVideo = document.getElementById('product-reel-video');
  var unmuteBtn = document.getElementById('reel-unmute-btn');
  if (productVideo && unmuteBtn) {
    unmuteBtn.addEventListener('click', function () {
      productVideo.muted = !productVideo.muted;
      var on = !productVideo.muted;
      unmuteBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      unmuteBtn.textContent = on ? 'Sound on' : 'Tap for sound';
      productVideo.play().catch(function () {});
    });
  }
})();
</script>
