{# Public shop v2 — professional light commerce polish #}
<style>
  /* ── Light-first tokens (surface-dark / modern_dark keeps dark via existing classes) ── */
  .shop-site--v2 {
    --shop-max: 1240px;
    --shop-radius-sm: 10px;
    --shop-radius-md: 16px;
    --shop-radius-lg: 24px;
    --shop-radius-card: 18px;
    --shop-header-height: 64px;
  }

  .shop-site--v2:not(.shop-site--surface-dark) {
    --shop-bg: #f6f7f9;
    --shop-surface: #ffffff;
    --shop-surface-elevated: #f1f3f6;
    --shop-text: #111827;
    --shop-muted: #6b7280;
    --shop-border: rgba(17, 24, 39, 0.08);
    --shop-border-strong: rgba(17, 24, 39, 0.12);
    --shop-gallery: #eef0f4;
    --shop-gallery-border: #e5e7eb;
    --shop-accent-soft: color-mix(in srgb, var(--shop-accent) 9%, #fff);
    --shop-accent-muted: color-mix(in srgb, var(--shop-accent) 16%, #f6f7f9);
    --shop-shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.05);
    --shop-shadow-md: 0 12px 32px rgba(17, 24, 39, 0.08);
    --shop-shadow-lg: 0 24px 56px rgba(17, 24, 39, 0.1);
    --shop-header-bg: rgba(255, 255, 255, 0.92);
    --shop-header-text: #111827;
    --shop-header-muted: #6b7280;
  }

  .shop-site--v2.shop-site--surface-dark,
  .shop-site--v2.shop-site--modern-dark {
    --shop-header-bg: rgba(12, 18, 34, 0.94);
    --shop-header-text: #f3f4f6;
    --shop-header-muted: #9ca3af;
  }

  /* ── Sticky header ── */
  .shop-site--v2 .shop-header-bar {
    position: sticky;
    top: 0;
    z-index: 60;
    background: var(--shop-header-bg);
    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    border-bottom: 1px solid var(--shop-border);
    box-shadow: 0 1px 0 rgba(17, 24, 39, 0.04);
  }

  .shop-site--v2 .shop-header-bar-inner {
    max-width: var(--shop-max);
    margin: 0 auto;
    padding: 10px clamp(16px, 3vw, 24px);
    min-height: var(--shop-header-height);
    align-items: center;
  }

  .shop-site--v2 .shop-top-nav-logo,
  .shop-site--v2 .shop-top-nav-logo-fallback {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .shop-site--v2 .shop-top-nav-logo-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, var(--shop-accent), color-mix(in srgb, var(--shop-accent) 60%, #14b8a6));
  }

  .shop-site--v2 .shop-top-nav-name {
    font-size: 0.9375rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--shop-header-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .shop-site--v2 .shop-header-search-field {
    border-radius: 999px;
    background: var(--shop-surface-elevated);
    border-color: var(--shop-border);
    padding: 0 16px;
  }

  .shop-site--v2 .shop-header-search-input {
    padding: 12px 0;
    font-size: 0.875rem;
  }

  .shop-site--v2 .shop-header-wa-btn {
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 0.8125rem;
    font-weight: 700;
  }

  .shop-site--v2 .shop-social-link {
    border-radius: 999px;
    padding: 8px 10px;
    background: var(--shop-surface-elevated);
    border-color: var(--shop-border);
  }

  /* ── Page shell ── */
  .shop-site--v2 .shop-shell {
    max-width: var(--shop-max);
    margin: 0 auto;
    padding: 0 clamp(16px, 3vw, 24px) calc(88px + env(safe-area-inset-bottom, 0px));
  }

  .shop-site--v2:not(.shop-site--has-mobile-nav):not(.shop-site--has-wa-fab) .shop-shell {
    padding-bottom: 40px;
  }

  /* ── Meta bar ── */
  .shop-site--v2 .shop-meta-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    margin: 16px 0 20px;
    padding: 0;
    background: transparent;
    border: 0;
  }

  .shop-site--v2 .shop-trust-strip-stat {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--shop-muted);
    background: var(--shop-surface);
    border: 1px solid var(--shop-border);
    border-radius: 999px;
    box-shadow: var(--shop-shadow-sm);
  }

  .shop-site--v2 .shop-trust-strip-stat svg {
    color: var(--shop-accent);
    opacity: 0.9;
  }

  .shop-site--v2 .shop-share-btn {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--shop-text);
    background: var(--shop-surface);
    border: 1px solid var(--shop-border);
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .shop-site--v2 .shop-share-btn:hover {
    border-color: var(--shop-border-strong);
    box-shadow: var(--shop-shadow-sm);
  }

  /* ── Page tagline ── */
  .shop-site--v2 .shop-page-tagline {
    margin: -8px 0 24px;
    font-size: 1.0625rem;
    line-height: 1.55;
    color: var(--shop-muted);
    max-width: 52ch;
  }

  /* ── Hero carousel ── */
  .shop-site--v2 .shop-marketplace-hero {
    margin-bottom: 28px;
  }

  .shop-site--v2 .shop-hero-carousel-only {
    border-radius: var(--shop-radius-lg);
    overflow: hidden;
    box-shadow: var(--shop-shadow-md);
    border: 1px solid var(--shop-border);
    background: var(--shop-surface);
  }

  .shop-site--v2 .shop-hero-carousel {
    position: relative;
    border-radius: var(--shop-radius-lg);
    overflow: hidden;
    background: var(--shop-gallery);
  }

  .shop-site--v2 .shop-hero-slide-media {
    aspect-ratio: 21 / 9;
    max-height: min(52vh, 420px);
    overflow: hidden;
    background: var(--shop-gallery);
  }

  @media (max-width: 639px) {
    .shop-site--v2 .shop-hero-slide-media {
      aspect-ratio: 4 / 3;
      max-height: 320px;
    }
  }

  .shop-site--v2 .shop-hero-slide-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .shop-site--v2 .shop-hero-slide-caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 20px 24px;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.72) 0%, transparent 100%);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 16px;
  }

  .shop-site--v2 .shop-hero-slide-title {
    font-size: clamp(1.125rem, 3vw, 1.5rem);
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .shop-site--v2 .shop-hero-slide-price {
    font-size: 1rem;
    font-weight: 700;
    color: #a7f3d0;
  }

  .shop-site--v2 .shop-hero-carousel-footer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--shop-surface);
    border-top: 1px solid var(--shop-border);
  }

  .shop-site--v2 .shop-hero-carousel-counter {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--shop-muted);
    min-width: 3.5rem;
  }

  .shop-site--v2 .shop-hero-carousel-dots {
    flex: 1;
    display: flex;
    justify-content: center;
    gap: 6px;
  }

  .shop-site--v2 .shop-hero-carousel-dot {
    width: 8px;
    height: 8px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: var(--shop-border-strong);
    cursor: pointer;
    transition: width 0.2s, background 0.2s;
  }

  .shop-site--v2 .shop-hero-carousel-dot.is-active {
    width: 24px;
    background: var(--shop-accent);
  }

  .shop-site--v2 .shop-hero-explore-btn {
    margin-left: auto;
    padding: 8px 16px;
    font-size: 0.8125rem;
    border-radius: 999px;
  }

  .shop-site--v2 .shop-hero-carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    color: #111827;
    cursor: pointer;
    box-shadow: var(--shop-shadow-md);
    transition: transform 0.12s;
  }

  .shop-site--v2 .shop-hero-carousel-btn:hover {
    transform: translateY(-50%) scale(1.04);
  }

  .shop-site--v2 .shop-hero-carousel-btn--prev { left: 16px; }
  .shop-site--v2 .shop-hero-carousel-btn--next { right: 16px; }

  /* ── Spotlight ── */
  .shop-site--v2 .shop-spotlight {
    margin-bottom: 28px;
    border-radius: var(--shop-radius-lg);
    overflow: hidden;
    border: 1px solid var(--shop-border);
    box-shadow: var(--shop-shadow-md);
    background: var(--shop-surface);
  }

  .shop-site--v2 .shop-spotlight-grid {
    display: grid;
    gap: 0;
  }

  @media (min-width: 768px) {
    .shop-site--v2 .shop-spotlight-grid {
      grid-template-columns: 1.1fr 0.9fr;
      min-height: 360px;
    }
  }

  .shop-site--v2 .shop-spotlight-copy {
    padding: clamp(24px, 4vw, 40px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }

  .shop-site--v2 .shop-spotlight-eyebrow {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--shop-accent);
    margin: 0;
  }

  .shop-site--v2 .shop-spotlight-title {
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin: 0;
    color: var(--shop-text);
  }

  .shop-site--v2 .shop-spotlight-price {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--shop-accent);
    margin: 0;
  }

  .shop-site--v2 .shop-spotlight-tagline {
    font-size: 1rem;
    color: var(--shop-muted);
    margin: 0;
    max-width: 40ch;
  }

  .shop-site--v2 .shop-spotlight-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }

  /* ── Catalog section ── */
  .shop-site--v2 .shop-catalog-section {
    margin-bottom: 40px;
  }

  .shop-site--v2 .shop-catalog-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--shop-border);
  }

  .shop-site--v2 .shop-section-sub {
    margin: 4px 0 0;
    font-size: 0.875rem;
    color: var(--shop-muted);
  }

  .shop-site--v2 .shop-section-count {
    flex-shrink: 0;
    padding: 6px 14px;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--shop-muted);
    background: var(--shop-surface-elevated);
    border-radius: 999px;
    border: 1px solid var(--shop-border);
  }

  .shop-site--v2 .shop-section-title {
    font-size: clamp(1.25rem, 3vw, 1.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--shop-text);
  }

  /* ── Product grid ── */
  .shop-site--v2 .shop-product-grid,
  .shop-site--v2 .shop-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  @media (min-width: 640px) {
    .shop-site--v2 .shop-product-grid,
    .shop-site--v2 .shop-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
  }

  @media (min-width: 1024px) {
    .shop-site--v2 .shop-product-grid,
    .shop-site--v2 .shop-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }
  }

  /* ── Product cards ── */
  .shop-site--v2 .shop-product-card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: var(--shop-surface);
    border: 1px solid var(--shop-border);
    border-radius: var(--shop-radius-card);
    overflow: hidden;
    box-shadow: var(--shop-shadow-sm);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .shop-site--v2 .shop-product-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shop-shadow-md);
    border-color: color-mix(in srgb, var(--shop-accent) 25%, var(--shop-border));
  }

  .shop-site--v2 .shop-product-card-media {
    position: relative;
    aspect-ratio: 4 / 5;
    background: var(--shop-gallery);
    overflow: hidden;
  }

  .shop-site--v2 .shop-product-card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.35s ease;
  }

  .shop-site--v2 .shop-product-card:hover .shop-product-card-media img {
    transform: scale(1.04);
  }

  .shop-site--v2 .shop-product-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1;
    padding: 4px 10px;
    font-size: 0.625rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-radius: 999px;
    background: rgba(17, 24, 39, 0.82);
    color: #fff;
  }

  .shop-site--v2 .shop-product-badge--featured {
    background: var(--shop-accent);
  }

  .shop-site--v2 .shop-product-badge--stock {
    background: rgba(220, 38, 38, 0.9);
  }

  .shop-site--v2 .shop-product-card-overlay {
    position: absolute;
    inset: auto 10px 10px 10px;
    padding: 10px;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #fff;
    background: rgba(17, 24, 39, 0.88);
    border-radius: 10px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s, transform 0.2s;
  }

  .shop-site--v2 .shop-product-card:hover .shop-product-card-overlay {
    opacity: 1;
    transform: translateY(0);
  }

  .shop-site--v2 .shop-product-card-arrow {
    display: none;
  }

  .shop-site--v2 .shop-product-card-body {
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }

  .shop-site--v2 .shop-product-card-category {
    margin: 0;
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--shop-muted);
  }

  .shop-site--v2 .shop-product-card-title {
    margin: 0;
    font-size: 0.9375rem;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.01em;
    color: var(--shop-text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .shop-site--v2 .shop-product-card-teaser {
    margin: 0;
    font-size: 0.8125rem;
    color: var(--shop-muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .shop-site--v2 .shop-product-card-price {
    margin: 6px 0 0;
    font-size: 1rem;
    font-weight: 800;
    color: var(--shop-accent);
    letter-spacing: -0.02em;
  }

  .shop-site--v2 .shop-product-card-footer {
    margin-top: auto;
    padding-top: 10px;
  }

  .shop-site--v2 .shop-product-card-cta {
    display: block;
    width: 100%;
    padding: 10px;
    text-align: center;
    font-size: 0.8125rem;
    font-weight: 700;
    color: var(--shop-text);
    background: var(--shop-surface-elevated);
    border: 1px solid var(--shop-border);
    border-radius: 10px;
    transition: background 0.15s, border-color 0.15s;
  }

  .shop-site--v2 .shop-product-card:hover .shop-product-card-cta {
    background: var(--shop-accent-soft);
    border-color: color-mix(in srgb, var(--shop-accent) 30%, transparent);
    color: var(--shop-accent);
  }

  /* ── Empty state ── */
  .shop-site--v2 .shop-empty-state {
    text-align: center;
    padding: 48px 24px;
    background: var(--shop-surface);
    border: 1px dashed var(--shop-border-strong);
    border-radius: var(--shop-radius-lg);
  }

  .shop-site--v2 .shop-empty-state svg {
    color: var(--shop-muted);
    margin-bottom: 12px;
  }

  .shop-site--v2 .shop-empty-title {
    font-size: 1.125rem;
    font-weight: 800;
    margin: 0 0 8px;
  }

  .shop-site--v2 .shop-empty-text {
    font-size: 0.9375rem;
    color: var(--shop-muted);
    max-width: 36ch;
    margin: 0 auto 20px;
  }

  /* ── About + FAQ ── */
  .shop-site--v2 .shop-about,
  .shop-site--v2 .shop-faq {
    margin-bottom: 36px;
    padding: 24px;
    background: var(--shop-surface);
    border: 1px solid var(--shop-border);
    border-radius: var(--shop-radius-lg);
    box-shadow: var(--shop-shadow-sm);
  }

  .shop-site--v2 .shop-about-blurb {
    margin: 12px 0 0;
    font-size: 0.9375rem;
    line-height: 1.65;
    color: var(--shop-muted);
  }

  .shop-site--v2 .shop-faq-item {
    border: 1px solid var(--shop-border);
    border-radius: var(--shop-radius-md);
    margin-bottom: 8px;
    overflow: hidden;
    background: var(--shop-surface-elevated);
  }

  .shop-site--v2 .shop-faq-question {
    padding: 14px 16px;
    font-size: 0.875rem;
    font-weight: 700;
    cursor: pointer;
    list-style: none;
  }

  .shop-site--v2 .shop-faq-answer {
    padding: 0 16px 14px;
    font-size: 0.875rem;
    color: var(--shop-muted);
    line-height: 1.55;
  }

  /* ── Trust / checkout band ── */
  .shop-site--v2 .shop-trust {
    margin-bottom: 32px;
    padding: 24px;
    text-align: center;
    background: linear-gradient(135deg, var(--shop-accent-soft), var(--shop-surface));
    border: 1px solid color-mix(in srgb, var(--shop-accent) 20%, var(--shop-border));
    border-radius: var(--shop-radius-lg);
  }

  .shop-site--v2 .shop-trust-title {
    font-size: 1rem;
    font-weight: 800;
    margin: 0 0 14px;
  }

  .shop-site--v2 .shop-trust-badges {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .shop-site--v2 .shop-trust-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    font-size: 0.8125rem;
    font-weight: 700;
    border-radius: 999px;
    background: var(--shop-surface);
    border: 1px solid var(--shop-border);
    box-shadow: var(--shop-shadow-sm);
  }

  .shop-site--v2 .shop-trust-badge--wa {
    color: #15803d;
    border-color: rgba(37, 211, 102, 0.35);
  }

  .shop-site--v2 .shop-trust-badge--mpesa {
    color: #15803d;
  }

  /* ── Buttons ── */
  .shop-site--v2 .shop-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 20px;
    font-family: inherit;
    font-size: 0.875rem;
    font-weight: 700;
    text-decoration: none;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.15s;
  }

  .shop-site--v2 .shop-btn--accent {
    color: #fff;
    background: var(--shop-accent);
    box-shadow: 0 4px 14px color-mix(in srgb, var(--shop-accent) 35%, transparent);
  }

  .shop-site--v2 .shop-btn--accent:hover {
    transform: translateY(-1px);
  }

  .shop-site--v2 .shop-btn--wa {
    color: #fff;
    background: var(--shop-wa);
    border-color: rgba(37, 211, 102, 0.4);
  }

  /* ── Footer ── */
  .shop-site--v2 .shop-powered {
    text-align: center;
    font-size: 0.75rem;
    color: var(--shop-muted);
    padding: 24px 0 8px;
  }

  .shop-site--v2 .shop-powered a {
    color: var(--shop-accent);
    font-weight: 700;
    text-decoration: none;
  }

  /* ── Mobile nav (light) ── */
  .shop-site--v2:not(.shop-site--surface-dark) .shop-mobile-nav {
    background: rgba(255, 255, 255, 0.96);
    border-top-color: var(--shop-border);
    box-shadow: 0 -8px 32px rgba(17, 24, 39, 0.08);
  }

  .shop-site--v2:not(.shop-site--surface-dark) .shop-mobile-nav-item {
