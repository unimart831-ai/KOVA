{# Shared reel styles for public commerce pages — flat, no floating cards #}
<style>
  :root {
    --commerce-gallery: #16162a;
    --commerce-gallery-border: #2a2a42;
    --commerce-radius-sm: 4px;
    --commerce-radius-md: 6px;
  }

  .reels-section {
    margin: 0 -16px 16px;
    padding: 14px 16px 12px;
    border-radius: 0;
    background: var(--commerce-gallery);
    border: 0;
    border-top: 1px solid var(--commerce-gallery-border);
    border-bottom: 1px solid var(--commerce-gallery-border);
    box-shadow: none;
  }

  .reels-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .reels-head-copy {
    min-width: 0;
  }

  .reels-title {
    font-size: 16px;
    font-weight: 700;
    color: #f9fafb;
    letter-spacing: -0.02em;
  }

  .reels-sub {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 2px;
  }

  .reels-hint {
    font-size: 11px;
    color: #a7f3d0;
    white-space: nowrap;
    padding: 4px 8px;
    border-radius: var(--commerce-radius-sm);
    background: rgba(5, 150, 105, 0.15);
    border: 1px solid rgba(167, 243, 208, 0.2);
    flex-shrink: 0;
  }

  .reels-track {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 2px 0 4px;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
  }

  .reels-track::-webkit-scrollbar {
    height: 3px;
  }

  .reels-track::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.18);
    border-radius: 0;
  }

  .reel-card {
    position: relative;
    flex-shrink: 0;
    width: 140px;
    scroll-snap-align: start;
  }

  .reel-link {
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .reel-frame {
    position: relative;
    border-radius: 0;
    overflow: hidden;
    background: #0b0b14;
    aspect-ratio: 9/16;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .reel-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #0b0b14;
  }

  .reel-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 6px;
    padding: 0;
  }

  .reel-meta {
    padding: 4px 0 0;
  }

  .reel-link-meta {
    display: block;
  }

  .reel-badge {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #fff;
    background: rgba(249, 115, 22, 0.92);
    padding: 3px 7px;
    border-radius: var(--commerce-radius-sm);
    pointer-events: none;
  }

  .reel-sound-btn {
    width: 28px;
    height: 28px;
    border: 1px solid rgba(167, 243, 208, 0.35);
    border-radius: var(--commerce-radius-sm);
    background: rgba(236, 253, 245, 0.12);
    color: #ecfdf5;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }

  .reel-name {
    display: block;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #f3f4f6;
  }

  .reel-price {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #6ee7b7;
    margin-top: 2px;
  }

  /* Product page hero reel */
  .product-reel-hero {
    margin-bottom: 0;
  }

  .product-reel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px 0;
  }

  .product-reel-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--commerce-text, #111827);
  }

  .product-reel-head-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .reel-unmute-btn {
    font-size: 11px;
    font-weight: 600;
    color: #059669;
    background: #ecfdf5;
    border: 1px solid #d1fae5;
    border-radius: var(--commerce-radius-sm);
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
  }

  .product-reel-frame {
    position: relative;
    width: 100%;
    max-width: 100%;
    margin: 8px 0 0;
    border-radius: 0;
    overflow: hidden;
    background: var(--commerce-gallery);
    aspect-ratio: 9/16;
    max-height: min(62vh, 440px);
    border: 0;
    border-top: 1px solid var(--commerce-divider, #e5e7eb);
  }

  .product-reel-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: var(--commerce-gallery);
  }
</style>
