{# Shared reel styles for public commerce pages #}
<style>
  .reels-section { margin-bottom: 20px; }
  .reels-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .reels-title { font-size: 16px; font-weight: 700; }
  .reels-hint { font-size: 11px; color: #6b7280; white-space: nowrap; }
  .reels-track { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; }
  .reel-card { position: relative; flex-shrink: 0; width: 132px; scroll-snap-align: start; }
  .reel-link { display: block; text-decoration: none; color: inherit; }
  .reel-frame { position: relative; border-radius: 14px; overflow: hidden; background: #111; aspect-ratio: 9/16; border: 1px solid #e5e7eb; }
  .reel-video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
  .reel-badge { position: absolute; top: 6px; left: 6px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #fff; background: rgba(249, 115, 22, 0.92); padding: 2px 6px; border-radius: 999px; pointer-events: none; }
  .reel-sound-btn { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border: 0; border-radius: 999px; background: rgba(0,0,0,0.55); color: #fff; font-size: 13px; line-height: 1; cursor: pointer; z-index: 2; }
  .reel-meta { padding: 8px 2px 0; }
  .reel-name { display: block; font-size: 12px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reel-price { display: block; font-size: 12px; font-weight: 700; color: #059669; margin-top: 2px; }
  .product-reel-section { margin-bottom: 16px; }
  .product-reel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .product-reel-title { font-size: 15px; font-weight: 700; }
  .reel-unmute-btn { font-size: 11px; font-weight: 600; color: #059669; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 999px; padding: 6px 10px; cursor: pointer; }
  .product-reel-frame { position: relative; max-width: 240px; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #111; aspect-ratio: 9/16; border: 1px solid #e5e7eb; }
  .product-reel-video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
</style>
