{# Shared reel styles for public commerce pages — Kova dark gallery palette #}
<style>
  :root {
    --commerce-gallery: #16162a;
    --commerce-gallery-border: #2a2a42;
    --commerce-radius-sm: 6px;
    --commerce-radius-md: 10px;
  }

  .reels-section {
    margin: 0 0 20px;
    padding: 16px 16px 14px;
    border-radius: var(--shop-radius-md, 14px);
    background: var(--commerce-gallery);
    border: 1px solid var(--commerce-gallery-border);
    box-shadow: var(--shop-shadow-md, 0 8px 24px rgba(0, 0, 0, 0.35));
  }

  .reels-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .reels-head-copy {
    min-width: 0;
  }

  .reels-title {
    font-size: 1rem;
    font-weight: 700;
    color: #f9fafb;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .reels-sub {
    font-size: 0.75rem;
    color: #9ca3af;
    margin: 2px 0 0;
  }

  .reels-hint {
    font-size: 0.6875rem;
    color: #6ee7b7;
    white-space: nowrap;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(13, 132, 116, 0.18);
    border: 1px solid rgba(110, 231, 183, 0.22);
    flex-shrink: 0;
  }

  .reels-track {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 2px 0 6px;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
  }

  .reels-track::-webkit-scrollbar {
    height: 4px;
  }

  .reels-track::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.18);
    border-radius: 4px;
  }

  .reel-card {
    position: relative;
    flex-shrink: 0;
    width: 148px;
    scroll-snap-align: start;
  }

  .reel-link {
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .reel-frame {
    position: relative;
    border-radius: var(--commerce-radius-sm);
    overflow: hidden;
    background: #0b0b14;
    aspect-ratio: 9/16;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .reel-play-btn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .reel-frame.is-paused .reel-play-btn,
  .product-reel-frame.is-paused .reel-play-btn {
    opacity: 1;
    pointer-events: auto;
  }

  .reel-play-btn--hero {
    width: 52px;
    height: 52px;
    font-size: 18px;
  }

  .reel-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #0b0b14;
  }

  .reel-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    padding: 0;
  }

  .reel-meta {
    padding: 4px 0 0;
  }

  .reel-link-meta {
    display: block;
  }

  .reel-badge {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #fff;
    background: linear-gradient(135deg, #0d8474, #14b8a6);
    padding: 3px 7px;
    border-radius: var(--commerce-radius-sm);
    pointer-events: none;
  }

  .reel-sound-btn {
    width: 28px;
    height: 28px;
    border: 1px solid rgba(110, 231, 183, 0.35);
    border-radius: var(--commerce-radius-sm);
    background: rgba(13, 132, 116, 0.15);
    color: #ecfdf5;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }

  .reel-name {
    display: block;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #f3f4f6;
  }

  .reel-price {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #6ee7b7;
    margin-top: 2px;
  }

  /* Product page hero reel */
  .product-reel-hero {
    margin-bottom: 0;
  }

  .product-reel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 18px 0;
  }

  .product-reel-title {
    font-size: 0.9375rem;
    font-weight: 700;
    color: #f9fafb;
    margin: 0;
  }

  .product-reel-head-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .reel-unmute-btn {
    font-size: 11px;
    font-weight: 600;
    color: #6ee7b7;
    background: rgba(13, 132, 116, 0.15);
    border: 1px solid rgba(110, 231, 183, 0.25);
    border-radius: var(--commerce-radius-sm);
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
  }

  .product-reel-frame {
    position: relative;
    width: auto;
    max-width: none;
    margin: 10px 14px 14px;
    border-radius: var(--commerce-radius-sm);
    overflow: hidden;
    background: var(--commerce-gallery);
    aspect-ratio: 9/16;
    max-height: min(58vh, 420px);
    border: 1px solid var(--commerce-gallery-border);
  }

  .product-reel-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: var(--commerce-gallery);
  }
</style>
