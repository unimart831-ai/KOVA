{# Shared reel styles for public commerce pages #}
<style>
  :root {
    --commerce-gallery: #16162a;
    --commerce-gallery-border: #2a2a42;
  }

  .reels-section {
    margin-bottom: 22px;
    padding: 16px 14px 14px;
    border-radius: 20px;
    background: linear-gradient(165deg, #16162a 0%, #1e1e38 55%, #12121f 100%);
    border: 1px solid var(--commerce-gallery-border);
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
  }

  .reels-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .reels-head-copy {
    min-width: 0;
  }

  .reels-title {
    font-size: 17px;
    font-weight: 700;
    color: #f9fafb;
    letter-spacing: -0.02em;
  }

  .reels-sub {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 2px;
  }

  .reels-hint {
    font-size: 11px;
    color: #a7f3d0;
    white-space: nowrap;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(5, 150, 105, 0.15);
    border: 1px solid rgba(167, 243, 208, 0.25);
    flex-shrink: 0;
  }

  .reels-track {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 2px 2px 6px;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
  }

  .reels-track::-webkit-scrollbar {
    height: 4px;
  }

  .reels-track::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.18);
    border-radius: 999px;
  }

  .reel-card {
    position: relative;
    flex-shrink: 0;
    width: 148px;
    scroll-snap-align: start;
  }

  .reel-link {
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .reel-frame {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #0b0b14;
    aspect-ratio: 9/16;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .reel-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #0b0b14;
  }

  .reel-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    padding: 0 2px;
  }

  .reel-meta {
    padding: 6px 2px 0;
  }

  .reel-link-meta {
    display: block;
  }

  .reel-badge {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #fff;
    background: rgba(249, 115, 22, 0.92);
    padding: 4px 8px;
    border-radius: 999px;
    pointer-events: none;
  }

  .reel-sound-btn {
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 999px;
    background: #ecfdf5;
    color: #065f46;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }

  .reel-name {
    display: block;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #f3f4f6;
  }

  .reel-price {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #6ee7b7;
    margin-top: 2px;
  }

  /* Product page hero reel */
  .product-reel-hero {
    margin-bottom: 14px;
  }

  .product-reel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 18px 0;
  }

  .product-reel-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--commerce-text, #111827);
  }

  .product-reel-head-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .reel-unmute-btn {
    font-size: 11px;
    font-weight: 600;
    color: #059669;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  .product-reel-frame {
    position: relative;
    width: 100%;
    max-width: 280px;
    margin: 12px auto 0;
    border-radius: 18px;
    overflow: hidden;
    background: var(--commerce-gallery);
    aspect-ratio: 9/16;
    max-height: min(68vh, 480px);
    border: 1px solid var(--commerce-gallery-border);
  }

  .product-reel-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: var(--commerce-gallery);
  }
</style>
