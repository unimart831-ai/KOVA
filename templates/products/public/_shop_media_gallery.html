{% if media_gallery %}
<style>
.shop-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.5rem; }
.shop-gallery-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 0.5rem; }
</style>
<section class="shop-section shop-gallery" aria-label="From our social">
  <div class="shop-section-head">
    <h2 class="shop-section-title">From our social</h2>
    <p class="shop-section-sub">Published with Kova</p>
  </div>
  <div class="shop-gallery-grid">
    {% for item in media_gallery %}
    <figure class="shop-gallery-item">
      <img src="{{ item.url }}" alt="" loading="lazy" class="shop-gallery-img">
    </figure>
    {% endfor %}
  </div>
</section>
{% endif %}
