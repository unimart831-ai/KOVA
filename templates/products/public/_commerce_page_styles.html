{# Magazine-style layout for public offer / product pages — Kova dark/teal #}
<style>
  .offer-page {
    max-width: var(--shop-max, 1120px);
    margin: 0 auto;
    padding: 0 0 calc(100px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
  }

  /* ── Dark hero band ── */
  .offer-hero-band {
    background:
      radial-gradient(ellipse 80% 60% at 50% -20%, var(--kova-teal-glow, rgba(13, 132, 116, 0.35)), transparent 55%),
      linear-gradient(165deg, var(--kova-navy-elevated, #1a2235) 0%, var(--kova-navy, #0c1222) 100%);
    border-bottom: 1px solid var(--shop-border, rgba(255, 255, 255, 0.08));
    padding: 0 20px 20px;
    margin-bottom: 24px;
  }

  .offer-breadcrumb {
    padding: 16px 0 18px;
  }

  .offer-breadcrumb-list {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 0;
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--shop-muted, #9ca3af);
  }

  .offer-breadcrumb-item {
    display: inline-flex;
    align-items: center;
    min-width: 0;
  }

  .offer-breadcrumb-item:not(:last-child)::after {
    content: "›";
    margin: 0 8px;
    color: #6b7280;
    font-weight: 500;
  }

  .offer-breadcrumb-item a {
    color: var(--shop-muted, #9ca3af);
    text-decoration: none;
    transition: color 0.15s;
  }

  .offer-breadcrumb-item a:hover {
    color: var(--kova-teal-bright, #14b8a6);
  }

  .offer-breadcrumb-item--current span {
    color: var(--shop-text, #f3f4f6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: min(52vw, 280px);
  }

  .offer-page-body {
    padding: 0 20px;
  }

  /* ── Magazine layout ── */
  .offer-magazine {
    display: grid;
    gap: 28px;
  }

  @media (min-width: 768px) {
    .offer-magazine {
      grid-template-columns: 1.15fr 0.85fr;
      gap: 40px;
      align-items: start;
    }
  }

  @media (min-width: 1024px) {
    .offer-magazine {
      gap: 48px;
    }

    .offer-page-body {
      max-width: var(--shop-max, 1120px);
      margin-left: auto;
      margin-right: auto;
    }
  }

  @media (max-width: 767px) {
    .offer-magazine {
      display: flex;
      flex-direction: column;
    }

    .offer-visual {
      order: 1;
    }

    .offer-info {
      order: 2;
    }
  }

  .offer-visual {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .offer-hero-frame {
    position: relative;
    border-radius: var(--shop-radius-lg, 20px);
    overflow: hidden;
    background: var(--shop-gallery, #16162a);
    box-shadow: var(--shop-shadow-lg);
    border: 1px solid var(--shop-gallery-border, #2a2a42);
    aspect-ratio: 1;
  }

  .offer-hero-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: var(--shop-gallery, #16162a);
  }

  .offer-thumbs {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }

  .offer-thumb {
    flex-shrink: 0;
    padding: 0;
    border: 2px solid transparent;
    border-radius: var(--shop-radius-sm, 10px);
    background: var(--shop-gallery, #16162a);
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .offer-thumb:hover {
    border-color: color-mix(in srgb, var(--shop-accent, #0d8474) 50%, transparent);
  }

  .offer-thumb.active {
    border-color: var(--kova-teal-bright, #14b8a6);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--shop-accent, #0d8474) 25%, transparent);
  }

  .offer-thumb img {
    width: 72px;
    height: 72px;
    object-fit: contain;
    display: block;
    background: var(--shop-gallery, #16162a);
  }

  .offer-gallery-counter {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--shop-muted, #9ca3af);
    text-align: center;
  }

  /* ── Product info column ── */
  .offer-info {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  @media (min-width: 768px) {
    .offer-info--sticky {
      position: sticky;
      top: 24px;
    }
  }

  .offer-eyebrow {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--kova-teal-bright, #14b8a6);
    margin: 0;
  }

  .offer-title {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.03em;
    margin: 0;
    color: var(--shop-text, #f3f4f6);
  }

  .offer-price-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .offer-price {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--kova-teal-bright, #14b8a6);
    letter-spacing: -0.02em;
  }

  .offer-stock-badge {
    display: inline-flex;
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(251, 191, 36, 0.12);
    color: #fbbf24;
    border: 1px solid rgba(251, 191, 36, 0.25);
  }

  .offer-stock-badge--out {
    background: rgba(239, 68, 68, 0.12);
    color: #f87171;
    border-color: rgba(239, 68, 68, 0.25);
  }

  .offer-desc-block {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 18px;
    background: var(--shop-surface, #151b2e);
    border: 1px solid var(--shop-border, rgba(255, 255, 255, 0.08));
    border-radius: var(--shop-radius-md, 14px);
  }

  .offer-desc {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .offer-desc p {
    font-size: 0.9375rem;
    line-height: 1.65;
    color: var(--shop-muted, #9ca3af);
    margin: 0;
  }

  .offer-desc-lead {
    font-size: 1.0625rem !important;
    font-weight: 600;
    color: var(--shop-text, #f3f4f6) !important;
    line-height: 1.55 !important;
  }

  .offer-highlights {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .offer-highlights li {
    position: relative;
    padding-left: 1.35rem;
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1.5;
    color: var(--kova-teal-bright, #14b8a6);
  }

  .offer-highlights li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.55em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--shop-accent, #0d8474);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--shop-accent, #0d8474) 25%, transparent);
  }

  .offer-fulfillment {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 16px 18px;
    background: color-mix(in srgb, var(--shop-accent, #0d8474) 12%, var(--shop-surface, #151b2e));
    border: 1px solid color-mix(in srgb, var(--shop-accent, #0d8474) 28%, transparent);
    border-radius: var(--shop-radius-md, 14px);
    box-shadow: var(--shop-shadow-sm);
  }

  .offer-fulfillment-icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: color-mix(in srgb, var(--shop-accent, #0d8474) 20%, transparent);
    color: var(--kova-teal-bright, #14b8a6);
  }

  .offer-fulfillment-copy {
    min-width: 0;
  }

  .offer-fulfillment-title {
    margin: 0 0 6px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--kova-teal-bright, #14b8a6);
  }

  .offer-fulfillment-text {
    margin: 0;
    font-size: 0.9375rem;
    line-height: 1.6;
    color: var(--shop-text, #f3f4f6);
  }

  .offer-seller-card {
    margin-top: 8px;
    padding: 16px;
    background: var(--shop-surface, #151b2e);
    border: 1px solid var(--shop-border, rgba(255, 255, 255, 0.08));
    border-radius: var(--shop-radius-md, 14px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .offer-seller-link {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    min-width: 0;
  }

  .offer-seller-logo,
  .offer-seller-logo-fallback {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex-shrink: 0;
    border: 1px solid var(--shop-border-strong, rgba(255, 255, 255, 0.14));
  }

  .offer-seller-logo {
    object-fit: cover;
  }

  .offer-seller-logo-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, var(--shop-accent, #0d8474), var(--kova-teal-bright, #14b8a6));
  }

  .offer-seller-copy {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .offer-seller-name {
    font-size: 0.9375rem;
    font-weight: 700;
    color: var(--shop-text, #f3f4f6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .offer-seller-city {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.75rem;
    color: var(--shop-muted, #9ca3af);
  }

  .offer-seller-cta {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--kova-teal-bright, #14b8a6);
  }

  .offer-seller-wa {
    width: 100%;
    margin-top: 0;
  }

  .offer-actions-card {
    background: var(--shop-surface, #151b2e);
    border: 1px solid var(--shop-border, rgba(255, 255, 255, 0.08));
    border-radius: var(--shop-radius-md, 14px);
    padding: 20px;
    box-shadow: var(--shop-shadow-sm);
  }

  .offer-actions-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--shop-muted, #9ca3af);
    margin: 0 0 12px;
  }

  .offer-actions-card .shop-btn {
    margin-top: 10px;
  }

  .offer-actions-card .shop-btn:first-of-type {
    margin-top: 0;
  }

  .offer-field {
    width: 100%;
    padding: 14px 16px;
    font-size: 1rem;
    font-family: inherit;
    border: 1.5px solid var(--shop-border-strong, rgba(255, 255, 255, 0.14));
    border-radius: var(--shop-radius-sm, 10px);
    margin-top: 10px;
    background: var(--shop-surface-elevated, #1a2235);
    color: var(--shop-text, #f3f4f6);
  }

  .offer-field::placeholder {
    color: #6b7280;
  }

  .offer-field:focus {
    outline: none;
    border-color: var(--shop-accent, #0d8474);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--shop-accent, #0d8474) 25%, transparent);
  }

  .offer-msg-err {
    font-size: 0.8125rem;
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: var(--shop-radius-sm, 10px);
    background: rgba(239, 68, 68, 0.12);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.25);
  }

  /* ── Reel section (uses _shop_reels_styles product-reel-* classes) ── */
  .offer-reel-card {
    margin: 0 20px 16px;
    border-radius: var(--shop-radius-md, 14px);
    overflow: hidden;
    border: 1px solid var(--shop-gallery-border, #2a2a42);
    background: var(--shop-gallery, #16162a);
    box-shadow: var(--shop-shadow-md);
  }

  .offer-reel-card .product-reel-title {
    color: #f9fafb;
  }

  .offer-reel-card .reel-unmute-btn {
    color: #6ee7b7;
    background: rgba(5, 150, 105, 0.15);
    border-color: rgba(167, 243, 208, 0.25);
  }

  /* ── Related products ── */
  .offer-related {
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid var(--shop-border, rgba(255, 255, 255, 0.08));
  }

  .offer-related .shop-grid {
    margin-top: 16px;
  }

  /* ── Sticky mobile CTA bar ── */
  .shop-site--has-mobile-nav .offer-sticky-bar {
    bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  }

  .shop-site--has-mobile-nav.shop-site--has-sticky-cta .offer-page {
    padding-bottom: calc(168px + env(safe-area-inset-bottom, 0px));
  }

  .offer-sticky-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 54;
    display: flex;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: rgba(12, 18, 34, 0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--shop-border-strong, rgba(255, 255, 255, 0.14));
    box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.4);
  }

  @media (min-width: 768px) {
    .offer-sticky-bar {
      display: none;
    }
  }

  .offer-sticky-price {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    flex: 0 0 auto;
  }

  .offer-sticky-price-label {
    font-size: 0.625rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--shop-muted, #9ca3af);
  }

  .offer-sticky-price-value {
    font-size: 1rem;
    font-weight: 800;
    color: var(--kova-teal-bright, #14b8a6);
    white-space: nowrap;
  }

  .offer-sticky-actions {
    display: flex;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  .offer-sticky-actions .shop-btn {
    flex: 1;
    padding: 12px 14px;
    font-size: 0.875rem;
    min-width: 0;
  }

  .offer-sticky-actions .shop-btn--wa {
    flex: 1.4;
    font-weight: 700;
  }

  /* ── M-Pesa payment states ── */
  [x-cloak] { display: none !important; }

  .pay-polling { text-align: center; padding: 24px 0; }
  .pay-spinner {
    width: 36px; height: 36px; margin: 0 auto 12px;
    border: 3.5px solid var(--shop-border-strong, rgba(255,255,255,0.14));
    border-top-color: var(--kova-teal-bright, #14b8a6);
    border-radius: 50%; animation: offer-spin .7s linear infinite;
  }
  @keyframes offer-spin { to { transform: rotate(360deg); } }
  .pay-polling-text { font-size: 15px; font-weight: 600; margin: 0 0 4px; color: var(--shop-text, #f3f4f6); }
  .pay-polling-sub { font-size: 13px; color: var(--shop-muted, #9ca3af); margin: 0 0 8px; }
  .pay-polling-timer { font-size: 12px; color: #6b7280; margin: 0; font-variant-numeric: tabular-nums; }
  .pay-result { text-align: center; padding: 20px 0; }
  .pay-result-icon {
    font-size: 36px; width: 56px; height: 56px; line-height: 56px;
    margin: 0 auto 10px; border-radius: 50%;
    background: var(--shop-accent-soft, rgba(13,132,116,0.18)); color: var(--kova-teal-bright, #14b8a6);
  }
  .pay-result-title { font-size: 16px; font-weight: 700; margin: 0 0 6px; color: var(--shop-text, #f3f4f6); }
  .pay-result-desc { font-size: 13px; color: var(--shop-muted, #9ca3af); margin: 0 0 14px; }
  .pay-receipt {
    text-align: left; background: var(--shop-surface-elevated, #1a2235);
    border-radius: var(--shop-radius-sm, 10px);
    padding: 12px 16px; font-size: 13px; margin: 12px 0 0;
    border: 1px solid var(--shop-border, rgba(255,255,255,0.08));
    color: var(--shop-muted, #9ca3af);
  }
  .pay-receipt p { margin: 4px 0; }
  .pay-success .pay-result-title { color: var(--kova-teal-bright, #14b8a6); }
  .pay-failed .pay-result-title, .pay-timeout .pay-result-title { color: #f87171; }
</style>
