{# Shared design tokens + flat layout for public commerce product pages #}
<style>
  :root {
    --commerce-bg: #ffffff;
    --commerce-surface: #ffffff;
    --commerce-gallery: #16162a;
    --commerce-gallery-border: #2a2a42;
    --commerce-border: #e5e7eb;
    --commerce-divider: #e5e7eb;
    --commerce-accent: #059669;
    --commerce-accent-hover: #047857;
    --commerce-accent-soft: #ecfdf5;
    --commerce-wa: #25D366;
    --commerce-text: #111827;
    --commerce-muted: #6b7280;
    --commerce-radius-sm: 4px;
    --commerce-radius-md: 6px;
    --commerce-page-width: 480px;
  }

  .commerce-page {
    max-width: var(--commerce-page-width);
    margin: 0 auto;
    padding: 12px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
    background: #f4f4f5;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .commerce-page * {
    box-sizing: border-box;
  }

  .shop-header {
    text-align: center;
    padding: 12px 16px 14px;
    border: 1px solid var(--commerce-divider);
    border-radius: var(--commerce-radius-sm);
    background: var(--commerce-bg);
  }

  .shop-header .eyebrow {
    font-size: 12px;
    color: var(--commerce-muted);
    letter-spacing: 0.02em;
  }

  .shop-header .brand-link {
    display: inline-block;
    margin-top: 4px;
    font-size: 15px;
    font-weight: 600;
    color: var(--commerce-accent);
    text-decoration: none;
  }

  .shop-header .brand-link:hover {
    text-decoration: underline;
  }

  .surface-card {
    background: var(--commerce-surface);
    border: 1px solid var(--commerce-divider);
    border-radius: var(--commerce-radius-sm);
    box-shadow: none;
    margin-bottom: 0;
    overflow: hidden;
  }

  .surface-card.pad {
    padding: 14px 16px 16px;
  }

  /* ── Gallery ── */
  .gallery-section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--commerce-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 12px 14px 0;
    background: var(--commerce-bg);
  }

  .gallery-card {
    background: var(--commerce-bg);
    padding: 0 0 12px;
  }

  .gallery-stage {
    position: relative;
    width: auto;
    margin: 10px 12px 0;
    aspect-ratio: 1;
    background: var(--commerce-gallery);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--commerce-gallery-border);
    border-radius: var(--commerce-radius-sm);
    overflow: hidden;
  }

  .gallery-stage img.hero-main {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: var(--commerce-gallery);
  }

  .gallery-toolbar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px 0;
    background: var(--commerce-bg);
    border-top: 0;
  }

  .gallery-counter {
    font-size: 11px;
    font-weight: 600;
    color: var(--commerce-muted);
    background: transparent;
    padding: 0;
    border-radius: 0;
    pointer-events: none;
  }

  .gallery-thumbs {
    display: flex;
    gap: 8px;
    padding: 8px 12px 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    background: var(--commerce-bg);
    border-top: 0;
  }

  .gallery-thumbs::-webkit-scrollbar {
    height: 3px;
  }

  .gallery-thumbs::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 0;
  }

  .thumb-btn {
    flex-shrink: 0;
    padding: 0;
    border: 2px solid transparent;
    border-radius: var(--commerce-radius-sm);
    background: rgba(255, 255, 255, 0.06);
    cursor: pointer;
    scroll-snap-align: start;
    transition: border-color 0.12s, background 0.12s;
  }

  .thumb-btn:hover {
    border-color: rgba(167, 243, 208, 0.7);
  }

  .thumb-btn.active {
    border-color: var(--commerce-accent);
    box-shadow: none;
    background: rgba(5, 150, 105, 0.15);
  }

  .thumb-btn img {
    width: 64px;
    height: 64px;
    border-radius: var(--commerce-radius-sm);
    object-fit: contain;
    background: var(--commerce-gallery);
    display: block;
  }

  /* ── Product info ── */
  .product-title {
    font-size: clamp(1.2rem, 4.5vw, 1.45rem);
    font-weight: 700;
    line-height: 1.25;
    color: var(--commerce-text);
    letter-spacing: -0.02em;
  }

  .price-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .price {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--commerce-accent);
    letter-spacing: -0.02em;
  }

  .stock-badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: var(--commerce-radius-sm);
    background: #fef3c7;
    color: #92400e;
  }

  .stock-badge.out {
    background: #fee2e2;
    color: #991b1b;
  }

  .desc-blocks {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .desc-blocks p {
    font-size: 14px;
    line-height: 1.5;
    color: #4b5563;
    margin: 0;
    padding: 0;
    border: 0;
  }

  .desc-blocks p + p {
    padding-top: 2px;
  }

  /* ── Reel hero ── */
  .product-reel-hero {
    margin-bottom: 0;
    padding-bottom: 12px;
  }

  .product-reel-section {
    margin-bottom: 0;
  }

  /* ── Actions ── */
  .actions-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--commerce-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    text-align: center;
    padding: 14px 16px;
    border-radius: var(--commerce-radius-md);
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    border: 0;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.12s;
  }

  .btn:first-of-type {
    margin-top: 0;
  }

  .btn:active:not(:disabled) {
    opacity: 0.88;
  }

  .btn-wa {
    background: var(--commerce-wa);
    color: #fff;
  }

  .btn-mpesa {
    background: var(--commerce-accent);
    color: #fff;
  }

  .btn-mpesa:hover:not(:disabled) {
    background: var(--commerce-accent-hover);
  }

  .btn-outline {
    background: var(--commerce-surface);
    color: var(--commerce-accent);
    border: 1px solid var(--commerce-accent);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .field {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    border: 1px solid var(--commerce-border);
    border-radius: var(--commerce-radius-md);
    margin-top: 8px;
    background: #fafafa;
  }

  .field:focus {
    outline: none;
    border-color: var(--commerce-accent);
    box-shadow: none;
  }

  .msg {
    font-size: 13px;
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: var(--commerce-radius-sm);
    display: none;
  }

  .msg.ok {
    background: var(--commerce-accent-soft);
    color: #065f46;
    display: block;
  }

  .msg.err {
    background: #fef2f2;
    color: #991b1b;
    display: block;
  }

  .page-footer {
    text-align: center;
    font-size: 11px;
    color: #9ca3af;
    margin-top: 16px;
    padding: 0 16px 8px;
  }
</style>
