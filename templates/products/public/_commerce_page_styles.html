{# Premium product detail page — professional ecommerce PDP #}
<style>
  .shop-site--pdp .offer-page {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 0 calc(24px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
  }

  /* ── Breadcrumb band ── */
  .offer-hero-band {
    padding: 0 clamp(16px, 3vw, 24px);
    margin-bottom: 0;
  }

  .offer-breadcrumb {
    padding: 12px 0 4px;
  }

  .offer-breadcrumb-list {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 0;
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--shop-muted);
  }

  .offer-breadcrumb-item {
    display: inline-flex;
    align-items: center;
    min-width: 0;
  }

  .offer-breadcrumb-item:not(:last-child)::after {
    content: "/";
    margin: 0 10px;
    color: var(--shop-muted);
    opacity: 0.5;
    font-weight: 400;
  }

  .offer-breadcrumb-item a {
    color: var(--shop-muted);
    text-decoration: none;
    transition: color 0.15s;
  }

  .offer-breadcrumb-item a:hover {
    color: var(--shop-accent);
  }

  .offer-breadcrumb-item--current span {
    color: var(--shop-text);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: min(52vw, 320px);
  }

  /* ── Trust strip ── */
  .offer-trust-strip {
    padding: 0 clamp(16px, 3vw, 24px);
    margin-bottom: 20px;
  }

  .offer-trust-strip-inner {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    padding: 12px 16px;
    background: var(--shop-surface);
    border: 1px solid var(--shop-border);
    border-radius: var(--shop-radius-md);
    box-shadow: var(--shop-shadow-sm);
  }

  .offer-trust-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--shop-muted);
  }

  .offer-trust-pill svg {
    flex-shrink: 0;
    color: var(--shop-accent);
  }

  .offer-page-body {
    padding: 0 clamp(16px, 3vw, 24px);
  }

  /* ── Two-column PDP layout ── */
  .offer-magazine {
    display: grid;
    gap: 32px;
    align-items: start;
  }

  @media (min-width: 900px) {
    .offer-magazine {
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
      gap: 48px;
    }
  }

  @media (max-width: 899px) {
    .offer-magazine {
      display: flex;
      flex-direction: column;
    }

    .offer-visual { order: 1; }
    .offer-info { order: 2; }
  }

  /* ── Gallery ── */
  .offer-visual {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .offer-gallery-stage {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .offer-hero-frame {
    position: relative;
    border-radius: var(--shop-radius-lg);
    overflow: hidden;
    background: var(--shop-gallery);
    border: 1px solid var(--shop-gallery-border);
    box-shadow: var(--shop-shadow-md);
    aspect-ratio: 1;
  }

  .offer-hero-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  @media (min-width: 900px) {
    .offer-hero-frame:hover img {
      transform: scale(1.03);
    }
  }

  .offer-gallery-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1px solid var(--shop-border-strong);
    background: rgba(255, 255, 255, 0.92);
    color: var(--shop-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shop-shadow-sm);
    transition: background 0.15s, transform 0.12s;
  }

  .shop-site--surface-dark .offer-gallery-nav {
    background: rgba(26, 34, 53, 0.92);
    color: #f3f4f6;
  }

  .offer-gallery-nav:hover {
    transform: translateY(-50%) scale(1.05);
  }

  .offer-gallery-nav--prev { left: 12px; }
  .offer-gallery-nav--next { right: 12px; }

  .offer-gallery-counter {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--shop-muted);
    text-align: center;
    margin: 0;
    font-variant-numeric: tabular-nums;
  }

  .offer-thumbs {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }

  .offer-thumb {
    flex-shrink: 0;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 10px;
    background: var(--shop-gallery);
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .offer-thumb:hover {
    border-color: color-mix(in srgb, var(--shop-accent) 40%, transparent);
  }

  .offer-thumb.active {
    border-color: var(--shop-accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--shop-accent) 20%, transparent);
  }

  .offer-thumb img {
    width: 72px;
    height: 72px;
    object-fit: cover;
    display: block;
  }

  /* ── Buy column ── */
  .offer-info {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  @media (min-width: 900px) {
    .offer-info--sticky {
      position: sticky;
      top: 88px;
    }
  }

  .offer-meta-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 12px;
  }

  .offer-category {
    display: inline-flex;
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--shop-accent-soft);
    color: var(--shop-accent);
    border: 1px solid color-mix(in srgb, var(--shop-accent) 25%, transparent);
  }

  .offer-eyebrow {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--shop-muted);
    margin: 0;
  }

  .offer-title {
    font-size: clamp(1.625rem, 4vw, 2.125rem);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.035em;
    margin: 0;
    color: var(--shop-text);
  }

  .offer-price-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
    padding-bottom: 4px;
  }

  .offer-price {
    font-size: 1.75rem;
    font-weight: 800;
    color: var(--shop-accent);
    letter-spacing: -0.03em;
  }

  .shop-site--surface-dark .offer-price {
    color: var(--kova-teal-bright);
  }

  .offer-stock-badge {
    display: inline-flex;
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(251, 191, 36, 0.12);
    color: #b45309;
    border: 1px solid rgba(251, 191, 36, 0.3);
  }

  .shop-site--surface-dark .offer-stock-badge {
    color: #fbbf24;
    background: rgba(251, 191, 36, 0.12);
  }

  .offer-stock-badge--out {
    background: rgba(239, 68, 68, 0.1);
    color: #dc2626;
    border-color: rgba(239, 68, 68, 0.25);
  }

  .shop-site--surface-dark .offer-stock-badge--out {
    color: #f87171;
  }

  .offer-stock-badge--service,
  .offer-stock-badge--digital {
    background: color-mix(in srgb, var(--shop-accent) 12%, transparent);
    color: var(--shop-accent);
    border-color: color-mix(in srgb, var(--shop-accent) 28%, transparent);
  }

  .offer-highlights--compact {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .offer-highlights--compact li {
    font-size: 0.8125rem;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--shop-surface-elevated);
    border: 1px solid var(--shop-border);
    color: var(--shop-text);
  }

  /* ── Buy box ── */
  .offer-actions-card {
    background: var(--shop-surface);
    border: 1px solid var(--shop-border);
    border-radius: var(--shop-radius-lg);
    padding: 24px;
    box-shadow: var(--shop-shadow-md);
  }

  .offer-actions-title {
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--shop-muted);
    margin: 0 0 14px;
  }

  .offer-actions-card .shop-btn {
    margin-top: 10px;
  }

  .offer-actions-card .shop-btn:first-of-type {
    margin-top: 0;
  }

  .offer-mpesa-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0 14px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--shop-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .offer-mpesa-divider::before,
  .offer-mpesa-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--shop-border);
  }

  .offer-field {
    width: 100%;
    padding: 14px 16px;
    font-size: 1rem;
    font-family: inherit;
    border: 1.5px solid var(--shop-border-strong);
    border-radius: 12px;
    margin-top: 10px;
    background: var(--shop-surface-elevated);
    color: var(--shop-text);
  }

  .offer-field:focus {
    outline: none;
    border-color: var(--shop-accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--shop-accent) 18%, transparent);
  }

  .offer-contact-note {
    margin: 12px 0 0;
    font-size: 0.875rem;
    color: var(--shop-muted);
    line-height: 1.5;
  }

  .offer-payment-methods {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--shop-border);
  }

  .offer-payment-chip {
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--shop-border);
    background: var(--shop-surface-elevated);
    color: var(--shop-muted);
  }

  .offer-payment-chip--wa {
    color: #15803d;
    border-color: rgba(37, 211, 102, 0.35);
    background: rgba(37, 211, 102, 0.08);
  }

  .offer-payment-chip--mpesa {
    color: #15803d;
    border-color: rgba(22, 163, 74, 0.35);
    background: rgba(22, 163, 74, 0.08);
  }

  .offer-msg-err {
    font-size: 0.8125rem;
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(239, 68, 68, 0.08);
    color: #dc2626;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }

  /* ── Seller card ── */
  .offer-seller-card {
    padding: 16px 18px;
    background: var(--shop-surface);
    border: 1px solid var(--shop-border);
    border-radius: var(--shop-radius-md);
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .offer-seller-card:hover {
    border-color: color-mix(in srgb, var(--shop-accent) 35%, transparent);
    box-shadow: var(--shop-shadow-sm);
  }

  .offer-seller-link {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    min-width: 0;
  }

  .offer-seller-logo,
  .offer-seller-logo-fallback {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    flex-shrink: 0;
    border: 1px solid var(--shop-border);
  }

  .offer-seller-logo { object-fit: cover; }

  .offer-seller-logo-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, var(--shop-accent), var(--kova-teal-bright));
  }

  .offer-seller-copy {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .offer-seller-name {
    font-size: 0.9375rem;
    font-weight: 700;
    color: var(--shop-text);
  }

  .offer-seller-city {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.75rem;
    color: var(--shop-muted);
  }

  .offer-seller-cta {
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--shop-accent);
  }

  /* ── Details section (tabs) ── */
  .offer-details {
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid var(--shop-border);
  }

  .offer-details-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--shop-border);
    margin-bottom: 24px;
    overflow-x: auto;
  }

  .offer-details-tab {
    padding: 12px 20px;
    font-family: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--shop-muted);
    background: transparent;
    border: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }

  .offer-details-tab:hover {
    color: var(--shop-text);
  }

  .offer-details-tab.is-active {
    color: var(--shop-accent);
    border-bottom-color: var(--shop-accent);
  }

  .offer-details-panel {
    display: none;
  }

  .offer-details-panel.is-active {
    display: block;
  }

  .offer-desc {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 72ch;
  }

  .offer-desc p {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--shop-muted);
    margin: 0;
  }

  .offer-desc-lead {
    font-size: 1.125rem !important;
    font-weight: 600;
    color: var(--shop-text) !important;
    line-height: 1.55 !important;
  }

  .offer-fulfillment--inline {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    padding: 20px 22px;
    background: var(--shop-surface-elevated);
    border: 1px solid var(--shop-border);
    border-radius: var(--shop-radius-md);
    max-width: 72ch;
  }

  .offer-fulfillment-icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: var(--shop-accent-soft);
    color: var(--shop-accent);
  }

  .offer-fulfillment-title {
    margin: 0 0 6px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--shop-accent);
  }

  .offer-fulfillment-text {
    margin: 0;
    font-size: 0.9375rem;
    line-height: 1.65;
    color: var(--shop-text);
  }

  /* ── Related products ── */
  .offer-related {
    margin-top: 56px;
    padding-top: 36px;
    border-top: 1px solid var(--shop-border);
  }

  .offer-related .shop-grid {
    margin-top: 20px;
  }

  .shop-site--pdp .shop-powered {
    text-align: center;
    margin-top: 40px;
    padding-bottom: 16px;
    font-size: 0.75rem;
    color: var(--shop-muted);
  }

  /* ── Product reel (PDP) ── */
  .offer-reel-section {
    margin: 0 clamp(16px, 3vw, 24px) 24px;
    padding: 20px;
    border-radius: var(--shop-radius-lg);
    background: var(--shop-surface);
    border: 1px solid var(--shop-border);
    box-shadow: var(--shop-shadow-sm);
  }

  .product-reel-layout {
    display: grid;
    gap: 20px;
    align-items: center;
  }

  @media (min-width: 768px) {
    .product-reel-layout {
      grid-template-columns: minmax(200px, 280px) 1fr;
      gap: 28px;
    }
  }

  .product-reel-device {
    position: relative;
    margin: 0 auto;
    width: min(100%, 260px);
    padding: 12px 10px 14px;
    border-radius: 28px;
    background: #0a0a12;
    border: 2px solid var(--shop-border-strong);
    box-shadow: var(--shop-shadow-lg);
  }

  .product-reel-device-notch {
    width: 36%;
    height: 5px;
    margin: 0 auto 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
  }

  .product-reel-kicker {
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--shop-accent);
    margin: 0 0 6px;
  }

  .product-reel-title {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--shop-text);
    margin: 0 0 8px;
  }

  .product-reel-desc {
    font-size: 0.9375rem;
    line-height: 1.55;
    color: var(--shop-muted);
    margin: 0 0 14px;
    max-width: 36ch;
  }

  /* ── Sticky mobile CTA ── */
  .shop-site--has-mobile-nav .offer-sticky-bar {
    bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  }

  .shop-site--has-sticky-cta:not(.shop-site--has-mobile-nav) .offer-page {
    padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  }

  .shop-site--has-mobile-nav.shop-site--has-sticky-cta .offer-page {
    padding-bottom: calc(168px + env(safe-area-inset-bottom, 0px));
  }

  .offer-sticky-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 54;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--shop-surface);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--shop-border-strong);
    box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.08);
  }

  .shop-site--surface-dark .offer-sticky-bar {
    background: rgba(12, 18, 34, 0.98);
    box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.45);
  }

  @media (min-width: 768px) {
    .offer-sticky-bar { display: none; }
  }

  .offer-sticky-price-label {
    font-size: 0.625rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--shop-muted);
  }

  .offer-sticky-price-value {
    font-size: 1.125rem;
    font-weight: 800;
    color: var(--shop-accent);
    letter-spacing: -0.02em;
  }

  .offer-sticky-actions {
    display: flex;
    gap: 8px;
    flex: 1;
    justify-content: flex-end;
  }

  .offer-sticky-actions .shop-btn {
    flex: 1;
    padding: 13px 16px;
    font-size: 0.875rem;
    max-width: none;
  }

  .offer-sticky-actions .shop-btn--wa-primary {
    flex: 2;
    font-weight: 700;
  }

  /* ── Mobile optimizations ── */
  @media (max-width: 767px) {
    .shop-site--product-page .offer-hero-band {
      display: none;
    }

    .shop-site--product-page .offer-trust-strip {
      margin-bottom: 12px;
    }

    .shop-site--product-page .offer-trust-strip-inner {
      padding: 10px 12px;
      gap: 6px 10px;
    }

    .shop-site--has-sticky-cta .offer-actions-card .shop-btn--wa,
    .shop-site--has-sticky-cta .offer-actions-card .offer-actions-title {
      display: none;
    }

    .shop-site--has-sticky-cta .offer-actions-card:not(:has(.offer-field, .shop-btn--accent, .shop-btn--outline)) {
      display: none;
    }

    .shop-site--has-sticky-cta .offer-price-row {
      display: none;
    }

    .shop-site--product-page .offer-title {
      font-size: 1.5rem;
    }

    .shop-site--product-page .offer-gallery-nav {
      width: 36px;
      height: 36px;
    }
  }

  /* ── M-Pesa payment states ── */
  [x-cloak] { display: none !important; }

  .pay-polling { text-align: center; padding: 24px 0; }
  .pay-spinner {
    width: 36px; height: 36px; margin: 0 auto 12px;
    border: 3.5px solid var(--shop-border-strong);
    border-top-color: var(--shop-accent);
    border-radius: 50%;
    animation: offer-spin .7s linear infinite;
  }
  @keyframes offer-spin { to { transform: rotate(360deg); } }
  .pay-polling-text { font-size: 15px; font-weight: 600; margin: 0 0 4px; color: var(--shop-text); }
  .pay-polling-sub { font-size: 13px; color: var(--shop-muted); margin: 0 0 8px; }
  .pay-polling-timer { font-size: 12px; color: var(--shop-muted); margin: 0; font-variant-numeric: tabular-nums; }
  .pay-result { text-align: center; padding: 20px 0; }
  .pay-result-icon {
    font-size: 36px; width: 56px; height: 56px; line-height: 56px;
    margin: 0 auto 10px; border-radius: 50%;
    background: var(--shop-accent-soft); color: var(--shop-accent);
  }
  .pay-result-title { font-size: 16px; font-weight: 700; margin: 0 0 6px; color: var(--shop-text); }
  .pay-result-desc { font-size: 13px; color: var(--shop-muted); margin: 0 0 14px; }
  .pay-receipt {
    text-align: left;
