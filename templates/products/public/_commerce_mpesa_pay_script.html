{% if mpesa_available and mpesa_pay_url %}
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
function mpesaPay() {
  return {
    state: 'idle',
    phone: '',
    submitting: false,
    errorMsg: '',
    paymentId: null,
    pollInterval: null,
    startTime: null,
    timerText: '',
    timerInterval: null,
    receipt: {},
    failReason: '',
    POLL_MS: 3000,
    TIMEOUT_MS: 120000,

    async initiate() {
      this.submitting = true;
      this.errorMsg = '';
      const fd = new FormData();
      fd.append('phone', this.phone);
      const csrfEl = document.querySelector('[name=csrfmiddlewaretoken]');
      if (csrfEl) fd.append('csrfmiddlewaretoken', csrfEl.value);
      try {
        const res = await fetch("{{ mpesa_pay_url }}", {
          method: 'POST', body: fd, headers: {'X-Requested-With': 'XMLHttpRequest'},
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          this.paymentId = data.payment_id;
          this.state = 'polling';
          this.startTime = Date.now();
          this.startPolling();
          this.startTimer();
        } else {
          this.errorMsg = data.error || 'Payment could not be started.';
          this.state = 'error';
        }
      } catch {
        this.errorMsg = 'Network error — try again.';
        this.state = 'error';
      }
      this.submitting = false;
    },

    startPolling() {
      this.stopPolling();
      this.pollInterval = setInterval(() => this.poll(), this.POLL_MS);
    },

    stopPolling() {
      if (this.pollInterval) { clearInterval(this.pollInterval); this.pollInterval = null; }
      if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
    },

    startTimer() {
      const tick = () => {
        const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
        const mins = Math.floor(elapsed / 60);
        const secs = elapsed % 60;
        this.timerText = `${mins}:${secs.toString().padStart(2, '0')} elapsed`;
      };
      tick();
      this.timerInterval = setInterval(tick, 1000);
    },

    async poll() {
      if (Date.now() - this.startTime > this.TIMEOUT_MS) {
        this.stopPolling();
        this.state = 'timeout';
        return;
      }
      if (!this.paymentId) return;
      try {
        const res = await fetch(`/shop/payment/${this.paymentId}/status/`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.status === 'completed') {
          this.stopPolling();
          this.receipt = data;
          this.state = 'success';
        } else if (data.status === 'failed') {
          this.stopPolling();
          this.failReason = data.result_desc || 'The payment was cancelled or failed.';
          this.state = 'failed';
        } else if (data.status === 'expired') {
          this.stopPolling();
          this.state = 'timeout';
        }
      } catch { /* keep polling */ }
    },

    retry() {
      this.stopPolling();
      this.state = 'idle';
      this.paymentId = null;
      this.errorMsg = '';
      this.receipt = {};
      this.failReason = '';
    },
  };
}
</script>
{% endif %}
