<section class="mp-boosted-section" aria-label="Boosted offers">
  <div class="kc-container">
    <div class="mp-carousel-wrap" data-boost-carousel>
      <button type="button" class="mp-carousel-nav mp-carousel-nav--prev" data-boost-prev aria-label="Scroll left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="mp-boost-track" data-boost-track role="list">
        {% for product in boost_products|slice:":12" %}
        {% include "products/public/_shop_product_card.html" with card_variant="boost" %}
        {% endfor %}
      </div>
      <button type="button" class="mp-carousel-nav mp-carousel-nav--next" data-boost-next aria-label="Scroll right">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </div>
</section>
