{% if shop_testimonials %}
<section class="flagship-testimonials" aria-label="Customer reviews">
  <div class="flagship-section-head">
    <h2 class="flagship-section-title">What customers say</h2>
  </div>
  <div class="testimonial-grid">
    {% for t in shop_testimonials %}
    <article class="testimonial-card">
      <div class="testimonial-stars" aria-label="{{ t.rating }} out of 5 stars">
        {% for i in "12345" %}{% if forloop.counter <= t.rating %}★{% else %}☆{% endif %}{% endfor %}
      </div>
      <p class="testimonial-quote">"{{ t.quote }}"</p>
      <p class="testimonial-author">{{ t.name }}</p>
      {% if t.location %}<p class="testimonial-location">{{ t.location }}</p>{% endif %}
    </article>
    {% endfor %}
  </div>
</section>
{% endif %}
