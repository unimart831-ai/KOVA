{# Shared design system for public shop storefront pages — Kova dark/teal palette #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Kova brand foundation */
    --kova-navy: #0c1222;
    --kova-navy-soft: #151b2e;
    --kova-navy-elevated: #1a2235;
    --kova-teal: #0d8474;
    --kova-teal-bright: #14b8a6;
    --kova-teal-glow: rgba(13, 132, 116, 0.35);

    --shop-accent: {{ commerce_branding.theme_primary_color|default:"#0d8474" }};
    --shop-accent-hover: color-mix(in srgb, var(--shop-accent) 82%, #fff);
    --shop-accent-soft: color-mix(in srgb, var(--shop-accent) 18%, var(--kova-navy-soft));
    --shop-accent-muted: color-mix(in srgb, var(--shop-accent) 35%, var(--kova-navy-soft));
    --shop-bg: var(--kova-navy);
    --shop-surface: var(--kova-navy-soft);
    --shop-surface-elevated: var(--kova-navy-elevated);
    --shop-text: #f3f4f6;
    --shop-muted: #9ca3af;
    --shop-border: rgba(255, 255, 255, 0.08);
    --shop-border-strong: rgba(255, 255, 255, 0.14);
    --shop-gallery: #16162a;
    --shop-gallery-border: #2a2a42;
    --shop-wa: #25D366;
    --shop-wa-hover: #1ebe57;
    --shop-mpesa: #16a34a;
    --shop-radius-sm: 10px;
    --shop-radius-md: 14px;
    --shop-radius-lg: 20px;
    --shop-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shop-shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shop-shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.4);
    --shop-max: 1120px;
    --shop-content: 680px;
  }

  .shop-site,
  .shop-site * {
    box-sizing: border-box;
  }

  .shop-site {
    margin: 0;
    min-height: 100vh;
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--shop-bg);
    color: var(--shop-text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .shop-container {
    max-width: var(--shop-max);
    margin: 0 auto;
    padding: 0 20px calc(88px + env(safe-area-inset-bottom, 0px));
  }

  .shop-container--narrow {
    max-width: var(--shop-content);
  }

  /* ── Site header / hero ── */
  .shop-hero {
    position: relative;
    padding: 32px 24px 28px;
    margin: 0 -20px 20px;
    background:
      radial-gradient(ellipse 90% 70% at 50% -10%, var(--kova-teal-glow), transparent 55%),
      linear-gradient(165deg, var(--kova-navy-elevated) 0%, var(--kova-navy) 100%);
    border-bottom: 1px solid var(--shop-border);
  }

  .shop-hero-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    max-width: var(--shop-max);
    margin: 0 auto;
  }

  .shop-logo {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    object-fit: cover;
    background: var(--shop-surface-elevated);
    box-shadow: var(--shop-shadow-md);
    border: 2px solid var(--shop-border-strong);
  }

  .shop-logo-fallback {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, var(--shop-accent), var(--kova-teal-bright));
    box-shadow: var(--shop-shadow-md);
  }

  .shop-brand-name {
    font-size: clamp(1.6rem, 5vw, 2.25rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: var(--shop-text);
    margin: 0;
  }

  .shop-tagline {
    font-size: 1rem;
    color: var(--shop-muted);
    max-width: 36ch;
    margin: 0;
  }

  .shop-location {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--kova-teal-bright);
    background: var(--shop-accent-soft);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--shop-accent) 35%, transparent);
  }

  .shop-hero-cta {
    width: 100%;
    max-width: 320px;
    margin-top: 4px;
  }

  .shop-hero-wa-note {
    font-size: 0.75rem;
    color: var(--shop-muted);
    margin: 0;
  }

  /* ── Section headings ── */
  .shop-section {
    margin-top: 28px;
  }

  .shop-section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .shop-section-title {
    font-size: 1.125rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--shop-text);
  }

  .shop-section-meta {
    font-size: 0.8125rem;
    color: var(--shop-muted);
    font-weight: 600;
  }

  /* ── Product grid ── */
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  @media (min-width: 640px) {
    .shop-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
  }

  @media (min-width: 900px) {
    .shop-grid {
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
  }

  .shop-card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: var(--shop-surface);
    border-radius: var(--shop-radius-md);
    overflow: hidden;
    box-shadow: var(--shop-shadow-sm);
    border: 1px solid var(--shop-border);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .shop-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shop-shadow-md);
    border-color: color-mix(in srgb, var(--shop-accent) 40%, transparent);
  }

  .shop-card-photo {
    position: relative;
    aspect-ratio: 1;
    background: var(--shop-gallery);
    overflow: hidden;
    border-bottom: 1px solid var(--shop-gallery-border);
  }

  .shop-card-photo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: var(--shop-gallery);
    transition: transform 0.3s ease;
  }

  .shop-card:hover .shop-card-photo img {
    transform: scale(1.03);
  }

  .shop-card-body {
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 4px;
  }

  .shop-card-name {
    font-size: 0.875rem;
    font-weight: 600;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .shop-card-price {
    font-size: 0.9375rem;
    font-weight: 800;
    color: var(--kova-teal-bright);
    margin-top: auto;
  }

  .shop-badge {
    display: inline-block;
    font-size: 0.625rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 7px;
    border-radius: 6px;
    align-self: flex-start;
  }

  .shop-badge--featured {
    background: var(--shop-accent-soft);
    color: var(--kova-teal-bright);
    border: 1px solid color-mix(in srgb, var(--shop-accent) 30%, transparent);
  }

  .shop-badge--stock {
    background: rgba(251, 191, 36, 0.12);
    color: #fbbf24;
    border: 1px solid rgba(251, 191, 36, 0.25);
  }

  .shop-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 800;
    color: var(--kova-teal-bright);
    background: var(--shop-gallery);
  }

  /* ── Trust footer ── */
  .shop-trust {
    margin-top: 36px;
    padding: 24px;
    background: var(--shop-surface);
    border-radius: var(--shop-radius-lg);
    box-shadow: var(--shop-shadow-sm);
    border: 1px solid var(--shop-border);
    text-align: center;
  }

  .shop-trust-title {
    font-size: 0.9375rem;
    font-weight: 700;
    margin: 0 0 12px;
    color: var(--shop-text);
  }

  .shop-trust-badges {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .shop-trust-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8125rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--shop-surface-elevated);
    border: 1px solid var(--shop-border);
    color: var(--shop-text);
  }

  .shop-trust-badge--wa {
    background: rgba(37, 211, 102, 0.12);
    border-color: rgba(37, 211, 102, 0.28);
    color: #4ade80;
  }

  .shop-trust-badge--mpesa {
    background: rgba(22, 163, 74, 0.1);
    border-color: rgba(22, 163, 74, 0.25);
    color: #86efac;
  }

  /* ── Buttons ── */
  .shop-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    text-align: center;
    padding: 14px 20px;
    border-radius: var(--shop-radius-sm);
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    border: 0;
    cursor: pointer;
    transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
  }

  .shop-btn:active {
    transform: scale(0.98);
  }

  .shop-btn svg {
    flex-shrink: 0;
  }

  .shop-btn--wa {
    background: var(--shop-wa);
    color: #fff;
    box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
  }

  .shop-btn--wa:hover {
    background: var(--shop-wa-hover);
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.45);
  }

  .shop-btn--wa-primary {
    font-size: 1.0625rem;
    font-weight: 700;
    padding: 16px 22px;
  }

  .shop-btn--accent {
    background: var(--shop-accent);
    color: #fff;
    box-shadow: 0 4px 14px var(--kova-teal-glow);
  }

  .shop-btn--accent:hover {
    background: var(--shop-accent-hover);
  }

  .shop-btn--outline {
    background: transparent;
    color: var(--kova-teal-bright);
    border: 1.5px solid color-mix(in srgb, var(--shop-accent) 55%, transparent);
  }

  .shop-btn--outline:hover {
    background: var(--shop-accent-soft);
  }

  .shop-btn--ghost {
    background: var(--shop-surface-elevated);
    color: var(--shop-muted);
    border: 1px solid var(--shop-border);
  }

  .shop-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .shop-wa-unavailable {
    font-size: 0.875rem;
    color: var(--shop-muted);
    text-align: center;
    padding: 12px 14px;
    border-radius: var(--shop-radius-sm);
    background: var(--shop-surface-elevated);
    border: 1px dashed var(--shop-border-strong);
    line-height: 1.5;
    margin: 0;
  }

  /* ── Site footer ── */
  .shop-powered {
    text-align: center;
    font-size: 0.6875rem;
    color: var(--shop-muted);
    margin-top: 32px;
    padding-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .shop-powered a {
    color: var(--kova-teal-bright);
    text-decoration: none;
  }

  .shop-powered a:hover {
    text-decoration: underline;
  }
</style>
