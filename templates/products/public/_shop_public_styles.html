{# Shared design system for public shop storefront pages — Kova dark/teal palette #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Kova brand foundation */
    --kova-navy: #0c1222;
    --kova-navy-soft: #151b2e;
    --kova-navy-elevated: #1a2235;
    --kova-teal: #0d8474;
    --kova-teal-bright: #14b8a6;
    --kova-teal-glow: rgba(13, 132, 116, 0.35);

    --shop-accent: {{ commerce_branding.theme_primary_color|default:"#0d8474" }};
    --shop-accent-hover: color-mix(in srgb, var(--shop-accent) 82%, #fff);
    --shop-accent-soft: color-mix(in srgb, var(--shop-accent) 18%, var(--kova-navy-soft));
    --shop-accent-muted: color-mix(in srgb, var(--shop-accent) 35%, var(--kova-navy-soft));
    --shop-bg: var(--kova-navy);
    --shop-surface: var(--kova-navy-soft);
    --shop-surface-elevated: var(--kova-navy-elevated);
    --shop-text: #f3f4f6;
    --shop-muted: #9ca3af;
    --shop-border: rgba(255, 255, 255, 0.08);
    --shop-border-strong: rgba(255, 255, 255, 0.14);
    --shop-gallery: #16162a;
    --shop-gallery-border: #2a2a42;
    --shop-wa: #25D366;
    --shop-wa-hover: #1ebe57;
    --shop-mpesa: #16a34a;
    --shop-radius-sm: 10px;
    --shop-radius-md: 14px;
    --shop-radius-lg: 20px;
    --shop-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shop-shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shop-shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.4);
    --shop-max: 1120px;
    --shop-content: 680px;
    --shop-radius-card: 16px;
  }

  /* ── Professional light commerce (surface-light / default catalog) ── */
  .shop-site--surface-light {
    --shop-bg: #f8fafc;
    --shop-surface: #ffffff;
    --shop-surface-elevated: #f1f5f9;
    --shop-text: #0f172a;
    --shop-muted: #64748b;
    --shop-border: rgba(15, 23, 42, 0.08);
    --shop-border-strong: rgba(15, 23, 42, 0.12);
    --shop-gallery: #f1f5f9;
    --shop-gallery-border: #e2e8f0;
    --shop-accent-soft: color-mix(in srgb, var(--shop-accent) 10%, #fff);
    --shop-accent-muted: color-mix(in srgb, var(--shop-accent) 18%, #f8fafc);
    --shop-shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shop-shadow-md: 0 10px 28px rgba(15, 23, 42, 0.08);
    --shop-shadow-lg: 0 20px 48px rgba(15, 23, 42, 0.1);
  }

  .shop-site--surface-light .shop-top-nav,
  .shop-site--surface-light .shop-header-bar {
    background: rgba(255, 255, 255, 0.94);
    border-bottom-color: var(--shop-border);
    box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
  }

  .shop-site--surface-light .shop-mobile-nav {
    background: rgba(255, 255, 255, 0.98);
    border-top-color: var(--shop-border-strong);
    box-shadow: 0 -4px 24px rgba(15, 23, 42, 0.06);
  }

  .shop-site--surface-light .shop-social-link {
    background: var(--shop-surface-elevated);
    color: var(--shop-muted);
  }

  .shop-site--surface-light .shop-product-card-price,
  .shop-site--surface-light .shop-card-price {
    color: var(--shop-accent);
  }

  .shop-site--surface-light.shop-site--marketplace {
    --shop-header-bg: rgba(255, 255, 255, 0.96);
    --shop-header-text: #0f172a;
    --shop-header-muted: #64748b;
  }

  .shop-site--surface-dark {
    --shop-bg: var(--kova-navy);
    --shop-surface: var(--kova-navy-soft);
    --shop-surface-elevated: var(--kova-navy-elevated);
    --shop-text: #f3f4f6;
    --shop-muted: #9ca3af;
    --shop-border: rgba(255, 255, 255, 0.08);
    --shop-border-strong: rgba(255, 255, 255, 0.14);
    --shop-gallery: #16162a;
    --shop-gallery-border: #2a2a42;
    --shop-accent-soft: color-mix(in srgb, var(--shop-accent) 18%, var(--kova-navy-soft));
    --shop-accent-muted: color-mix(in srgb, var(--shop-accent) 35%, var(--kova-navy-soft));
    --shop-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shop-shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shop-shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.4);
  }

  .shop-site,
  .shop-site * {
    box-sizing: border-box;
  }

  .shop-site {
    margin: 0;
    min-height: 100vh;
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--shop-bg);
    color: var(--shop-text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .shop-container {
    max-width: var(--shop-max);
    margin: 0 auto;
    padding: 0 20px calc(88px + env(safe-area-inset-bottom, 0px));
  }

  .shop-site--has-mobile-nav .shop-container {
    padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px));
  }

  /* ── Sticky top nav ── */
  .shop-top-nav {
    position: sticky;
    top: 0;
    z-index: 60;
    background: rgba(12, 18, 34, 0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--shop-border);
    box-shadow: var(--shop-shadow-sm);
  }

  .shop-top-nav-inner {
    max-width: var(--shop-max);
    margin: 0 auto;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .shop-top-nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    min-width: 0;
  }

  .shop-top-nav-logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--shop-border-strong);
  }

  .shop-top-nav-logo-fallback {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, var(--shop-accent), var(--kova-teal-bright));
    flex-shrink: 0;
  }

  .shop-top-nav-name {
    font-size: 0.9375rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .shop-top-nav-social {
    display: none;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  @media (min-width: 640px) {
    .shop-top-nav-social {
      display: flex;
    }
  }

  .shop-social-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--shop-muted);
    background: var(--shop-surface-elevated);
    border: 1px solid var(--shop-border);
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }

  .shop-social-link:hover {
    color: var(--shop-text);
    border-color: var(--shop-border-strong);
  }

  .shop-social-link--whatsapp,
  .shop-social-link--primary {
    color: #4ade80;
    background: rgba(37, 211, 102, 0.12);
    border-color: rgba(37, 211, 102, 0.28);
  }

  .shop-social-link-label {
    display: none;
  }

  @media (min-width: 900px) {
    .shop-social-link-label {
      display: inline;
    }
  }

  /* ── Mobile bottom nav ── */
  .shop-mobile-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 55;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    background: rgba(12, 18, 34, 0.96);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--shop-border-strong);
    box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.35);
  }

  @media (min-width: 640px) {
    .shop-mobile-nav {
      display: none;
    }
  }

  .shop-mobile-nav-inner {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 8px;
    max-width: var(--shop-max);
    margin: 0 auto;
  }

  .shop-mobile-nav-item {
    flex: 1;
    min-width: 0;
    max-width: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 10px 6px;
    border-radius: var(--shop-radius-sm);
    text-decoration: none;
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--shop-muted);
    background: var(--shop-surface-elevated);
    border: 1px solid var(--shop-border);
    transition: transform 0.12s, background 0.15s;
  }

  .shop-mobile-nav-item:active {
    transform: scale(0.97);
  }

  .shop-mobile-nav-item span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .shop-mobile-nav-item--whatsapp,
  .shop-mobile-nav-item--primary {
    flex: 1.35;
    color: #fff;
    background: var(--shop-wa);
    border-color: rgba(37, 211, 102, 0.5);
    box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
  }

  .shop-container--narrow {
    max-width: var(--shop-content);
  }

  /* ── Site header / hero ── */
  .shop-hero {
    position: relative;
    padding: 32px 24px 28px;
    margin: 0 -20px 20px;
    background:
      radial-gradient(ellipse 90% 70% at 50% -10%, var(--kova-teal-glow), transparent 55%),
      linear-gradient(165deg, var(--kova-navy-elevated) 0%, var(--kova-navy) 100%);
    border-bottom: 1px solid var(--shop-border);
  }

  .shop-hero-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    max-width: var(--shop-max);
    margin: 0 auto;
  }

  .shop-logo {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    object-fit: cover;
    background: var(--shop-surface-elevated);
    box-shadow: var(--shop-shadow-md);
    border: 2px solid var(--shop-border-strong);
  }

  .shop-logo-fallback {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, var(--shop-accent), var(--kova-teal-bright));
    box-shadow: var(--shop-shadow-md);
  }

  .shop-brand-name {
    font-size: clamp(1.6rem, 5vw, 2.25rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: var(--shop-text);
    margin: 0;
  }

  .shop-tagline {
    font-size: 1rem;
    color: var(--shop-muted);
    max-width: 36ch;
    margin: 0;
  }

  .shop-location {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--kova-teal-bright);
    background: var(--shop-accent-soft);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--shop-accent) 35%, transparent);
  }

  .shop-hero-cta {
    width: 100%;
    max-width: 320px;
    margin-top: 4px;
  }

  .shop-hero-wa-note {
    font-size: 0.75rem;
    color: var(--shop-muted);
    margin: 0;
  }

  /* ── Section headings ── */
  .shop-section {
    margin-top: 28px;
  }

  .shop-section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .shop-section-title {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 0;
    color: var(--shop-text);
  }

  .shop-section-meta {
    font-size: 0.8125rem;
    color: var(--shop-muted);
    font-weight: 600;
  }

  .shop-section-sub {
    font-size: 0.875rem;
    color: var(--shop-muted);
    margin: 4px 0 0;
    font-weight: 500;
  }

  .shop-section-head:has(.shop-section-sub) {
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
  }

  /* ── Product grid ── */
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  @media (min-width: 640px) {
    .shop-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
  }

  @media (min-width: 900px) {
    .shop-grid {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
  }

  @media (min-width: 1200px) {
    .shop-hero {
      margin-left: auto;
      margin-right: auto;
      max-width: var(--shop-max);
      border-radius: var(--shop-radius-lg);
      border: 1px solid var(--shop-border);
      margin-bottom: 28px;
    }
  }

  .shop-card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: var(--shop-surface);
    border-radius: var(--shop-radius-md);
    overflow: hidden;
    box-shadow: var(--shop-shadow-sm);
    border: 1px solid var(--shop-border);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .shop-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shop-shadow-md);
    border-color: color-mix(in srgb, var(--shop-accent) 40%, transparent);
  }

  .shop-card-photo {
    position: relative;
    aspect-ratio: 1;
    background: var(--shop-gallery);
    overflow: hidden;
    border-bottom: 1px solid var(--shop-gallery-border);
  }

  .shop-card-photo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: var(--shop-gallery);
    transition: transform 0.3s ease;
  }

  .shop-card:hover .shop-card-photo img {
    transform: scale(1.03);
  }

  .shop-card-body {
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 4px;
  }

  .shop-card-name {
    font-size: 0.875rem;
    font-weight: 600;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .shop-card-teaser {
    font-size: 0.75rem;
    line-height: 1.45;
    color: var(--shop-muted);
    margin: 2px 0 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .shop-card-price {
    font-size: 0.9375rem;
    font-weight: 800;
    color: var(--kova-teal-bright);
    margin-top: auto;
  }

  .shop-badge {
    display: inline-block;
    font-size: 0.625rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 7px;
    border-radius: 6px;
    align-self: flex-start;
  }

  .shop-badge--featured {
    background: var(--shop-accent-soft);
    color: var(--kova-teal-bright);
    border: 1px solid color-mix(in srgb, var(--shop-accent) 30%, transparent);
  }

  .shop-badge--stock {
    background: rgba(251, 191, 36, 0.12);
    color: #fbbf24;
    border: 1px solid rgba(251, 191, 36, 0.25);
  }

  .shop-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 800;
    color: var(--kova-teal-bright);
    background: var(--shop-gallery);
  }

  /* ── Trust footer ── */
  .shop-trust {
    margin-top: 36px;
    padding: 24px;
    background: var(--shop-surface);
    border-radius: var(--shop-radius-lg);
    box-shadow: var(--shop-shadow-sm);
    border: 1px solid var(--shop-border);
    text-align: center;
  }

  .shop-trust-title {
    font-size: 0.9375rem;
    font-weight: 700;
    margin: 0 0 12px;
    color: var(--shop-text);
  }

  .shop-trust-badges {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .shop-trust-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8125rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--shop-surface-elevated);
    border: 1px solid var(--shop-border);
    color: var(--shop-text);
  }

  .shop-trust-badge--wa {
    background: rgba(37, 211, 102, 0.12);
    border-color: rgba(37, 211, 102, 0.28);
    color: #4ade80;
  }

  .shop-trust-badge--mpesa {
    background: rgba(22, 163, 74, 0.1);
    border-color: rgba(22, 163, 74, 0.25);
    color: #86efac;
  }

  /* ── Buttons ── */
  .shop-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    text-align: center;
    padding: 14px 20px;
    border-radius: var(--shop-radius-sm);
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    border: 0;
    cursor: pointer;
    transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
  }

  .shop-btn:active {
    transform: scale(0.98);
  }

  .shop-btn svg {
    flex-shrink: 0;
  }

  .shop-btn--wa {
    background: var(--shop-wa);
    color: #fff;
    box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
  }

  .shop-btn--wa:hover {
    background: var(--shop-wa-hover);
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.45);
  }

  .shop-btn--wa-primary {
    font-size: 1.0625rem;
    font-weight: 700;
    padding: 16px 22px;
  }

  .shop-btn--accent {
    background: var(--shop-accent);
    color: #fff;
    box-shadow: 0 4px 14px var(--kova-teal-glow);
  }

  .shop-btn--accent:hover {
    background: var(--shop-accent-hover);
  }

  .shop-btn--outline {
    background: transparent;
    color: var(--kova-teal-bright);
    border: 1.5px solid color-mix(in srgb, var(--shop-accent) 55%, transparent);
  }

  .shop-btn--outline:hover {
    background: var(--shop-accent-soft);
  }

  .shop-btn--ghost {
    background: var(--shop-surface-elevated);
    color: var(--shop-muted);
    border: 1px solid var(--shop-border);
  }

  .shop-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .shop-btn--lg {
    padding: 16px 22px;
    font-size: 1.0625rem;
    font-weight: 700;
    border-radius: 12px;
  }

  .shop-wa-unavailable {
    font-size: 0.875rem;
    color: var(--shop-muted);
    text-align: center;
    padding: 12px 14px;
    border-radius: var(--shop-radius-sm);
    background: var(--shop-surface-elevated);
    border: 1px dashed var(--shop-border-strong);
    line-height: 1.5;
    margin: 0;
  }

  /* ── Site footer ── */
  .shop-powered {
    text-align: center;
    font-size: 0.6875rem;
    color: var(--shop-muted);
    margin-top: 32px;
    padding-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .shop-powered a {
    color: var(--kova-teal-bright);
    text-decoration: none;
  }

  .shop-powered a:hover {
    text-decoration: underline;
  }

  /* ── Trust strip (count, updated, share) ── */
  .shop-trust-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    margin: 20px 0 4px;
    padding: 0;
    border: 0;
    background: transparent;
  }

  .shop-trust-strip-stat {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--shop-muted);
  }

  .shop-trust-strip-stat svg {
    color: var(--kova-teal-bright);
    flex-shrink: 0;
  }

  .shop-share-btn {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid var(--shop-border-strong);
    background: var(--shop-surface-elevated);
    color: var(--shop-text);
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .shop-share-btn:hover {
    background: var(--shop-accent-soft);
    border-color: color-mix(in srgb, var(--shop-accent) 35%, transparent);
  }

  .shop-share-btn[hidden] {
    display: none;
  }

  /* ── Featured horizontal row ── */
  .shop-featured {
    margin-top: 20px;
  }

  .shop-featured-track {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding: 2px 0 8px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--shop-accent-muted) transparent;
  }

  .shop-featured-track::-webkit-scrollbar {
    height: 6px;
  }

  .shop-featured-track::-webkit-scrollbar-thumb {
    background: var(--shop-accent-muted);
    border-radius: 999px;
  }

  .shop-card--featured {
    flex: 0 0 min(72vw, 220px);
    scroll-snap-align: start;
  }

  .shop-featured--hero {
    margin-top: 8px;
    padding: 18px 16px 16px;
    border-radius: var(--shop-radius-lg);
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, var(--kova-teal-glow), transparent 60%),
      var(--shop-surface);
    border: 1px solid var(--shop-border-strong);
    box-shadow: var(--shop-shadow-md);
  }

  .shop-featured--hero .shop-card--featured {
    flex: 0 0 min(78vw, 260px);
  }

  .shop-featured--hero .shop-card-photo {
    aspect-ratio: 4 / 5;
  }

  /* ── About blurb ── */
  .shop-about-blurb {
    font-size: 0.9375rem;
    line-height: 1.6;
    color: var(--shop-muted);
    margin: 0;
    max-width: 42ch;
  }

  .shop-about-blurb--hero {
    text-align: center;
  }

  .shop-about {
    margin-top: 28px;
    padding: 20px 22px;
    border-radius: var(--shop-radius-md);
    background: var(--shop-surface);
    border: 1px solid var(--shop-border);
  }

  /* ── FAQ accordion ── */
  .shop-faq {
    margin-top: 28px;
  }

  .shop-faq-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }

  .shop-faq-item {
    border-radius: var(--shop-radius-sm);
    background: var(--shop-surface);
    border: 1px solid var(--shop-border);
    overflow: hidden;
  }

  .shop-faq-item[open] {
    border-color: color-mix(in srgb, var(--shop-accent) 35%, transparent);
  }

  .shop-faq-question {
    padding: 14px 16px;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--shop-text);
    cursor: pointer;
    list-style: none;
  }

  .shop-faq-question::-webkit-details-marker {
    display: none;
  }

  .shop-faq-question::after {
    content: "+";
    float: right;
    color: var(--kova-teal-bright);
    font-weight: 700;
  }

  .shop-faq-item[open] .shop-faq-question::after {
    content: "−";
  }

  .shop-faq-answer {
    padding: 0 16px 14px;
    font-size: 0.8125rem;
    line-height: 1.55;
    color: var(--shop-muted);
  }

  /* ── Compact hero (featured_carousel mode) ── */
  .shop-hero--compact {
    padding: 20px 20px 18px;
    margin-bottom: 12px;
  }

  .shop-hero--compact .shop-logo,
  .shop-hero--compact .shop-logo-fallback {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    font-size: 20px;
  }

  .shop-hero--compact .shop-brand-name {
    font-size: clamp(1.25rem, 4vw, 1.6rem);
  }

  .shop-tagline--compact {
    font-size: 0.875rem;
  }

  .shop-category-section + .shop-category-section {
    margin-top: 8px;
  }

  /* ── Archetype: boutique & market-stall (warm light) ── */
  .shop-site--boutique,
  .shop-site--market-stall {
    --shop-bg: #faf7f2;
    --shop-surface: #ffffff;
    --shop-surface-elevated: #f5f0e8;
    --shop-text: #1c1917;
    --shop-muted: #78716c;
    --shop-border: rgba(28, 25, 23, 0.08);
    --shop-border-strong: rgba(28, 25, 23, 0.14);
    --shop-gallery: #f0ebe3;
    --shop-gallery-border: #e7e0d5;
    --shop-accent-soft: color-mix(in srgb, var(--shop-accent) 12%, #faf7f2);
    --shop-accent-muted: color-mix(in srgb, var(--shop-accent) 22%, #f5f0e8);
    --shop-shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.06);
    --shop-shadow-md: 0 8px 24px rgba(28, 25, 23, 0.08);
    --shop-shadow-lg: 0 16px 40px rgba(28, 25, 23, 0.1);
  }

  .shop-site--boutique .shop-top-nav,
  .shop-site--market-stall .shop-top-nav {
    background: rgba(250, 247, 242, 0.94);
    border-bottom-color: rgba(28, 25, 23, 0.08);
  }

  .shop-site--boutique .shop-mobile-nav,
  .shop-site--market-stall .shop-mobile-nav {
    background: rgba(250, 247, 242, 0.96);
    border-top-color: rgba(28, 25, 23, 0.1);
  }

  .shop-site--boutique .shop-hero,
  .shop-site--market-stall .shop-hero {
    background:
      radial-gradient(ellipse 90% 70% at 50% -10%, color-mix(in srgb, var(--shop-accent) 18%, transparent), transparent 55%),
      linear-gradient(165deg, #fff 0%, #faf7f2 100%);
    border-bottom-color: rgba(28, 25, 23, 0.08);
  }

  .shop-site--boutique .shop-card-price,
  .shop-site--market-stall .shop-card-price {
    color: var(--shop-accent);
  }

  .shop-site--boutique .shop-location {
    color: var(--shop-accent);
  }

  /* Boutique: 2-col editorial grid */
  .shop-site--boutique .shop-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  @media (min-width: 900px) {
    .shop-site--boutique .shop-grid {
      grid-template-columns: repeat(2, 1fr);
      max-width: 720px;
      margin: 0 auto;
    }
  }

  /* Market stall: menu-list rows */
  .shop-site--market-stall .shop-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .shop-site--market-stall .shop-card {
    flex-direction: row;
    align-items: stretch;
  }

  .shop-site--market-stall .shop-card-photo {
    width: 96px;
    min-width: 96px;
    aspect-ratio: 1;
    border-bottom: 0;
    border-right: 1px solid var(--shop-gallery-border);
  }

  .shop-site--market-stall .shop-card-body {
    justify-content: center;
    padding: 12px 14px;
  }

  .shop-site--market-stall .shop-card-name {
    -webkit-line-clamp: 3;
  }

  .shop-site--market-stall .shop-card:hover {
    transform: none;
    box-shadow: var(--shop-shadow-sm);
  }

  /* Reel shop & modern dark: dense 3-col catalog */
  .shop-site--reel-shop .shop-grid,
  .shop-site--modern-dark .shop-grid,
  .shop-site--catalog .shop-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  @media (min-width: 480px) {
    .shop-site--reel-shop .shop-grid,
    .shop-site--modern-dark .shop-grid,
    .shop-site--catalog .shop-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (min-width: 900px) {
    .shop-site--reel-shop .shop-grid,
    .shop-site--modern-dark .shop-grid {
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
  }

  .shop-site--reel-shop .shop-card-photo,
  .shop-site--modern-dark .shop-card-photo {
    aspect-ratio: 3 / 4;
  }

  .shop-site--reel-shop .shop-card-photo img,
  .shop-site--modern-dark .shop-card-photo img {
    object-fit: cover;
  }

  /* reels_first: tighter spacing after strip */
  .shop-site--reels-first .reels-section {
    margin-top: 4px;
  }

  .shop-site--reels-first .shop-hero {
    margin-top: 4px;
  }

  /* ── Marketplace layout (reference e-commerce) ── */
  .shop-site--marketplace {
    --shop-header-bg: rgba(12, 18, 34, 0.94);
    --shop-header-text: #f3f4f6;
    --shop-header-muted: #9ca3af;
    --shop-radius-card: 16px;
  }

  .shop-header-bar {
    background: var(--shop-header-bg);
    backdrop-filter: blur(16px);
    border-bottom-color: var(--shop-border);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .shop-header-bar .shop-top-nav-name,
  .shop-header-bar .shop-top-nav-brand {
    color: var(--shop-header-text);
  }

  .shop-header-bar-inner {
    flex-wrap: nowrap;
    gap: 12px 16px;
    padding-top: 12px;
    padding-bottom: 12px;
  }

  .shop-header-brand {
    flex: 0 1 auto;
    min-width: 0;
    max-width: 220px;
  }

  .shop-header-search {
    flex: 1 1 320px;
    min-width: 0;
    max-width: 480px;
    margin: 0 auto;
  }

  .shop-header-search-field {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--shop-surface-elevated);
    border-radius: 12px;
    border: 1px solid var(--shop-border-strong);
    padding: 0 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .shop-header-search-field:focus-within {
    border-color: color-mix(in srgb, var(--shop-accent) 45%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--shop-accent) 18%, transparent);
  }

  .shop-header-search-icon {
    flex-shrink: 0;
    color: var(--shop-muted);
  }

  .shop-header-search-input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: 11px 0;
    font-family: inherit;
    font-size: 0.875rem;
    color: var(--shop-text);
    outline: none;
  }

  .shop-header-search-input::placeholder {
    color: var(--shop-muted);
  }

  .shop-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .shop-header-wa-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 0.8125rem;
    font-weight: 700;
    color: #fff;
    background: var(--shop-wa);
    border: 1px solid rgba(37, 211, 102, 0.35);
    box-shadow: 0 4px 14px rgba(37, 211, 102, 0.25);
    transition: transform 0.12s, box-shadow 0.15s;
  }

  .shop-header-wa-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(37, 211, 102, 0.35);
  }

  .shop-header-wa-label {
    display: none;
  }

  @media (min-width: 768px) {
    .shop-header-wa-label {
      display: inline;
    }
  }

  @media (max-width: 639px) {
    .shop-header-bar-inner {
      flex-wrap: wrap;
    }

    .shop-site--product-page .shop-header-bar-inner {
      flex-wrap: nowrap;
    }

    .shop-header-brand {
      flex: 1 1 auto;
      max-width: none;
    }

    .shop-site--product-page .shop-header-brand {
      max-width: calc(100% - 48px);
    }

    .shop-header-search {
      order: 3;
      width: 100%;
      max-width: none;
      flex-basis: 100%;
    }

    .shop-header-actions {
      margin-left: auto;
    }

    .shop-header-social {
      display: none;
    }
  }

  /* Hero 3-column grid */
  .shop-marketplace-hero {
    margin: 16px 0 24px;
  }

  .shop-hero-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 14px;
    align-items: stretch;
  }

  .shop-hero-side {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .shop-hero-promos-mobile {
    display: none;
  }

  @media (max-width: 899px) {
    .shop-hero-grid {
      grid-template-columns: 1fr;
    }

    .shop-hero-side {
      display: none;
    }

    .shop-hero-promos-mobile {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
  }

  .shop-hero-promo-card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: var(--shop-surface);
    border-radius: var(--shop-radius-card);
    overflow: hidden;
    border: 1px solid var(--shop-border);
    box-shadow: var(--shop-shadow-sm);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    min-height: 0;
    flex: 1;
  }

  .shop-hero-promo-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shop-shadow-md);
  }

  .shop-hero-promo-media {
    position: relative;
    aspect-ratio: 4 / 3;
    background: var(--shop-gallery);
    overflow: hidden;
  }

  .shop-hero-promo-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .shop-hero-promo-ad {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 0.5625rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: #fff;
    background: rgba(0, 0, 0, 0.45);
    padding: 3px 6px;
    border-radius: 4px;
  }

  .shop-hero-promo-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
  }

  .shop-hero-promo-name {
    font-size: 0.75rem;
    font-weight: 600;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  .shop-hero-promo-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 999px;
    background: var(--shop-accent);
    color: #fff;
    flex-shrink: 0;
  }

  /* Center carousel */
  .shop-hero-center {
    min-width: 0;
  }

  .shop-hero-carousel {
    position: relative;
    background: var(--shop-surface);
    border-radius: var(--shop-radius-card);
    border: 1px solid var(--shop-border);
    box-shadow: var(--shop-shadow-md);
    overflow: hidden;
    height: 100%;
    min-height: 280px;
    display: flex;
    flex-direction: column;
  }

  .shop-hero-carousel-track {
    position: relative;
    flex: 1;
    min-height: 220px;
  }

  .shop-hero-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .shop-hero-slide.is-active {
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
  }

  .shop-hero-slide-link {
    display: flex;
    flex-direction: column;
    height: 100%;
    text-decoration: none;
    color: inherit;
  }

  .shop-hero-slide-media {
    position: relative;
    flex: 1;
    min-height: 180px;
    background: var(--shop-gallery);
    overflow: hidden;
  }

  .shop-hero-slide-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .shop-hero-slide-media--reel .reel-frame {
    height: 100%;
    aspect-ratio: auto;
    border: 0;
    border-radius: 0;
  }

  .shop-hero-slide-media--reel .reel-video {
    object-fit: cover;
  }

  .shop-hero-slide-media--brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    text-align: center;
  }

  .shop-hero-slide-logo {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    object-fit: cover;
  }

  .shop-hero-slide-logo-fallback {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    font-size: 28px;
  }

  .shop-hero-slide-brand {
    font-size: 1.25rem;
    font-weight: 800;
    margin: 0;
  }

  .shop-hero-slide-tagline {
    font-size: 0.875rem;
    color: var(--shop-muted);
    margin: 0;
    max-width: 32ch;
  }

  .shop-hero-slide-caption {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid var(--shop-border);
    background: var(--shop-surface-elevated);
  }

  .shop-hero-slide-title {
    font-size: 0.875rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .shop-hero-slide-price {
    font-size: 0.875rem;
    font-weight: 800;
    color: var(--shop-accent);
    flex-shrink: 0;
  }

  .shop-hero-carousel-btn {
    position: absolute;
    top: 42%;
    transform: translateY(-50%);
    z-index: 3;
    width: 36px;
    height: 36px;
    border-radius: 999px;
    border: 1px solid var(--shop-border-strong);
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }

  .shop-hero-carousel-btn:hover {
    background: rgba(0, 0, 0, 0.65);
  }

  .shop-hero-carousel-btn--prev { left: 10px; }
  .shop-hero-carousel-btn--next { right: 10px; }

  .shop-hero-carousel-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-top: 1px solid var(--shop-border);
    background: var(--shop-surface);
  }

  .shop-hero-carousel-counter {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--shop-muted);
    white-space: nowrap;
  }

  .shop-hero-carousel-dots {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: 1;
  }

  .shop-hero-carousel-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    border: 0;
    padding: 0;
    background: var(--shop-accent-muted);
    cursor: pointer;
    transition: width 0.2s, background 0.2s;
  }

  .shop-hero-carousel-dot.is-active {
    width: 22px;
    background: var(--shop-accent);
  }

  .shop-hero-explore-btn {
    width: auto;
    padding: 10px 18px;
    font-size: 0.8125rem;
    white-space: nowrap;
    border-radius: 999px;
  }

  /* Layout B — 5-column product grid */
  .shop-site--marketplace .shop-product-grid,
  .shop-site--marketplace .shop-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  @media (min-width: 640px) {
    .shop-site--marketplace .shop-product-grid,
    .shop-site--marketplace .shop-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
  }

  @media (min-width: 900px) {
    .shop-site--marketplace .shop-product-grid,
    .shop-site--marketplace .shop-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
  }

  @media (min-width: 1200px) {
    .shop-site--marketplace .shop-product-grid,
    .shop-site--marketplace .shop-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
  }

  .shop-product-card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: var(--shop-surface);
    border-radius: var(--shop-radius-card);
    overflow: hidden;
    border: 1px solid var(--shop-border);
    box-shadow: var(--shop-shadow-sm);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .shop-product-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shop-shadow-md);
    border-color: color-mix(in srgb, var(--shop-accent) 40%, transparent);
  }

  .shop-product-card[hidden] {
    display: none;
  }

  .shop-product-card-media {
    position: relative;
    aspect-ratio: 4 / 5;
    background: linear-gradient(145deg, var(--shop-gallery) 0%, var(--shop-surface-elevated) 100%);
    overflow: hidden;
  }

  .shop-product-card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }

  .shop-product-card:hover .shop-product-card-media img {
    transform: scale(1.05);
  }

  .shop-product-card-arrow {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    color: #fff;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s, transform 0.2s;
  }

  .shop-product-card:hover .shop-product-card-arrow {
    opacity: 1;
    transform: translateY(0);
  }

  .shop-product-card-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 23, 42, 0.35);
    color: #fff;
    font-size: 0.8125rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }

  .shop-product-card:hover .shop-product-card-overlay {
    opacity: 1;
  }

  .shop-product-card-category {
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--shop-muted);
    margin: 0;
  }

  .shop-product-card-teaser {
