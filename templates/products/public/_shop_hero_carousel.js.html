<script>
(function () {
  var root = document.querySelector('[data-shop-carousel]');
  if (!root) return;

  var slides = Array.prototype.slice.call(root.querySelectorAll('.shop-hero-slide'));
  if (!slides.length) return;

  var dots = Array.prototype.slice.call(root.querySelectorAll('[data-carousel-dot]'));
  var counter = root.querySelector('[data-carousel-counter]');
  var prevBtn = root.querySelector('[data-carousel-prev]');
  var nextBtn = root.querySelector('[data-carousel-next]');
  var index = 0;
  var timer = null;
  var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function pauseVideos(exceptSlide) {
    root.querySelectorAll('.shop-hero-reel-video').forEach(function (video) {
      var slide = video.closest('.shop-hero-slide');
      if (slide !== exceptSlide) {
        video.pause();
        var frame = video.closest('.reel-frame');
        if (frame) frame.classList.add('is-paused');
      }
    });
  }

  function playActiveVideo(slide) {
    if (!slide) return;
    var video = slide.querySelector('.shop-hero-reel-video');
    if (!video || prefersReducedMotion) return;
    pauseVideos(slide);
    var playPromise = video.play();
    if (playPromise && playPromise.catch) playPromise.catch(function () {});
    var frame = video.closest('.reel-frame');
    if (frame) frame.classList.remove('is-paused');
  }

  function setSlide(nextIndex) {
    index = (nextIndex + slides.length) % slides.length;
    slides.forEach(function (slide, i) {
      slide.classList.toggle('is-active', i === index);
    });
    dots.forEach(function (dot, i) {
      dot.classList.toggle('is-active', i === index);
      dot.setAttribute('aria-selected', i === index ? 'true' : 'false');
    });
    if (counter) {
      counter.textContent = (index + 1) + ' / ' + slides.length;
    }
    playActiveVideo(slides[index]);
  }

  function next() { setSlide(index + 1); }
  function prev() { setSlide(index - 1); }

  function startAutoplay() {
    if (prefersReducedMotion || slides.length < 2) return;
    stopAutoplay();
    timer = window.setInterval(next, 5500);
  }

  function stopAutoplay() {
    if (timer) {
      window.clearInterval(timer);
      timer = null;
    }
  }

  if (prevBtn) prevBtn.addEventListener('click', function () { stopAutoplay(); prev(); startAutoplay(); });
  if (nextBtn) nextBtn.addEventListener('click', function () { stopAutoplay(); next(); startAutoplay(); });
  dots.forEach(function (dot) {
    dot.addEventListener('click', function () {
      stopAutoplay();
      setSlide(parseInt(dot.getAttribute('data-carousel-dot'), 10) || 0);
      startAutoplay();
    });
  });

  root.addEventListener('mouseenter', stopAutoplay);
  root.addEventListener('mouseleave', startAutoplay);
  root.addEventListener('focusin', stopAutoplay);
  root.addEventListener('focusout', startAutoplay);

  slides.forEach(function (slide) {
    slide.addEventListener('click', function (e) {
      if (e.target.closest('button, a, video')) return;
      var url = slide.getAttribute('data-slide-url');
      if (url) window.location.href = url;
    });
  });

  setSlide(0);
  startAutoplay();
})();
</script>
