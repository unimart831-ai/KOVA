<section class="flagship-values" aria-label="Why shop here">
  <div class="flagship-value">
    <div class="flagship-value-icon">✓</div>
    <p class="flagship-value-label">Genuine products</p>
    <p class="flagship-value-sub">Verified seller</p>
  </div>
  <div class="flagship-value">
    <div class="flagship-value-icon">🚚</div>
    <p class="flagship-value-label">Fast delivery</p>
    <p class="flagship-value-sub">{% if profile.city %}{{ profile.city }}{% else %}Across Kenya{% endif %}</p>
  </div>
  <div class="flagship-value">
    <div class="flagship-value-icon">💬</div>
    <p class="flagship-value-label">WhatsApp orders</p>
    <p class="flagship-value-sub">Chat &amp; buy</p>
  </div>
  {% if mpesa_shop_enabled %}
  <div class="flagship-value">
    <div class="flagship-value-icon">📱</div>
    <p class="flagship-value-label">M-Pesa pay</p>
    <p class="flagship-value-sub">Secure STK</p>
  </div>
  {% endif %}
  <div class="flagship-value">
    <div class="flagship-value-icon">↩️</div>
    <p class="flagship-value-label">Easy returns</p>
    <p class="flagship-value-sub">Message us</p>
  </div>
</section>
