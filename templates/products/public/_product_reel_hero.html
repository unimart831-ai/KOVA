{# Product reel — integrated into PDP, phone-frame on desktop #}
{% if product_reel %}
<section class="offer-reel-section product-reel-hero" aria-label="Product video">
  <div class="product-reel-layout">
    <div class="product-reel-device">
      <div class="product-reel-device-notch" aria-hidden="true"></div>
      <div class="product-reel-frame is-paused">
        <video id="product-reel-video"
               class="product-reel-video"
               src="{{ product_reel.video_url }}"
               {% if product_reel.poster_url %}poster="{{ product_reel.poster_url }}"{% endif %}
               muted loop playsinline preload="metadata"
               aria-label="{{ product.name }} reel"></video>
        <button type="button" class="reel-play-btn reel-play-btn--hero" id="product-reel-play-btn" aria-label="Play {{ product.name }} reel">▶</button>
      </div>
    </div>
    <div class="product-reel-aside">
      <p class="product-reel-kicker">Video preview</p>
      <h2 class="product-reel-title">See it in action</h2>
      <p class="product-reel-desc">Watch how {{ product.name|truncatechars:48 }} looks before you order.</p>
      <button type="button" class="reel-unmute-btn" id="reel-unmute-btn" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        Tap for sound
      </button>
    </div>
  </div>
</section>
{% endif %}
