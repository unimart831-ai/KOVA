{% extends "layouts/app.html" %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="card p-6">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_name" class="label">Category Name *</label>
        {{ form.name }}
        {% if form.name.errors %}<p class="text-xs text-red-500 mt-1">{{ form.name.errors.0 }}</p>{% endif %}
      </div>
      <div>
        <label for="id_description" class="label">Description</label>
        {{ form.description }}
      </div>
      <div class="flex items-center justify-between pt-2">
        <a href="{% url 'products:categories' %}" class="btn-secondary text-sm px-4 py-2">Cancel</a>
        <button type="submit" class="btn-primary text-sm px-6 py-2">Create Category</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
