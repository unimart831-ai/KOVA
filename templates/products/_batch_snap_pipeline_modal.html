{# Live Batch Snap pipeline modal — opens when ?batch=id1,id2,... #}
{% if batch_product_ids %}
<div x-data="batchSnapPipelineModal('{{ batch_product_ids|escapejs }}', '{{ batch_session_id|escapejs }}')"
     x-init="init()"
     x-cloak>
  <div x-show="open"
       class="fixed inset-0 z-[9999] flex items-center justify-center p-4"
       role="dialog"
       aria-modal="true"
       aria-labelledby="batch-snap-pipeline-title">
    <div class="absolute inset-0 bg-gray-950/70 backdrop-blur-sm" @click="close()"></div>

    <div class="relative w-full max-w-xl max-h-[90vh] overflow-hidden rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 shadow-2xl flex flex-col">
      <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800 bg-gradient-to-r from-kova-600 to-kova-800 dark:from-kova-700 dark:to-kova-900">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="text-[10px] font-semibold text-white/70 uppercase tracking-wider">Market Day · Batch Snap</p>
            <h2 id="batch-snap-pipeline-title" class="text-lg font-bold text-white mt-0.5" x-text="headerTitle"></h2>
            <p class="text-xs text-white/80 mt-1" x-text="headerSubtitle"></p>
          </div>
          <button type="button" @click="close()" class="text-white/70 hover:text-white p-1 shrink-0" aria-label="Close">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-5 space-y-4">
        <template x-if="processing">
          <div>
            <div class="h-1.5 bg-gray-100 dark:bg-gray-800 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-kova-500 to-kova-700 rounded-full transition-all duration-700"
                   :style="'width:' + progressPercent + '%'"></div>
            </div>
            <p class="text-[10px] text-gray-400 mt-1.5 text-center">
              <span x-text="completedCount"></span>/<span x-text="totalCount"></span> products processed
            </p>
          </div>
        </template>

        <div>
          <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Overall progress</h3>
          <ul class="space-y-2">
            <template x-for="step in steps" :key="step.id">
              <li class="flex gap-3 text-sm rounded-lg p-2.5 border border-gray-100 dark:border-gray-800">
                <span class="flex-shrink-0 mt-0.5">
                  <template x-if="step.status === 'completed'">
                    <svg class="w-4 h-4 text-growth-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                  </template>
                  <template x-if="step.status === 'running'">
                    <span class="block w-4 h-4 border-2 border-kova-500 border-t-transparent rounded-full animate-spin"></span>
                  </template>
                  <template x-if="step.status === 'pending'">
                    <span class="block w-4 h-4 rounded-full border-2 border-gray-300"></span>
                  </template>
                </span>
                <div>
                  <p class="font-medium text-gray-900 dark:text-white" x-text="step.message"></p>
                  <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5" x-text="step.detail"></p>
                </div>
              </li>
            </template>
          </ul>
        </div>

        <div>
          <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Each product</h3>
          <ul class="space-y-2 max-h-56 overflow-y-auto">
            <template x-for="item in items" :key="item.product_id">
              <li class="flex gap-3 p-3 rounded-lg border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-800/30">
                <div class="w-12 h-12 rounded-lg overflow-hidden bg-gray-200 dark:bg-gray-700 shrink-0">
                  <img x-show="item.image_url" :src="item.image_url" alt="" class="w-full h-full object-cover">
                </div>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <p class="text-sm font-medium text-gray-900 dark:text-white truncate" x-text="item.product_name"></p>
                    <span x-show="item.status === 'processing'" class="text-[9px] text-gold-600 animate-pulse">Working…</span>
                    <span x-show="item.status === 'completed'" class="text-[9px] text-growth-600">Ready</span>
                    <span x-show="item.status === 'failed'" class="text-[9px] text-red-600">Failed</span>
                  </div>
                  <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 line-clamp-2" x-text="item.current_detail || item.current_step"></p>
                  <p x-show="item.post_count" class="text-[10px] text-kova-600 dark:text-kova-400 mt-1" x-text="item.post_count + ' post(s)'"></p>
                </div>
              </li>
            </template>
          </ul>
        </div>

        <template x-if="status === 'failed'">
          <div class="bg-red-50 dark:bg-red-950/30 border border-red-200 rounded-xl p-4">
            <p class="text-sm font-medium text-red-800 dark:text-red-200" x-text="errorMessage"></p>
          </div>
        </template>

        <template x-if="heroPickerItems.length">
          <div class="rounded-xl border border-kova-200 dark:border-kova-800 bg-kova-50/40 dark:bg-kova-950/20 p-4">
            <div class="flex items-start justify-between gap-2 mb-3">
              <div>
                <h3 class="text-xs font-semibold text-kova-900 dark:text-kova-100 uppercase tracking-wider">Pick hero shots</h3>
                <p class="text-xs text-kova-700 dark:text-kova-300 mt-0.5">
                  Choose the best scene for each product — used in your shop and carousel posts.
                </p>
                <p x-show="brandLock.surface_vibe" class="text-[10px] text-kova-600/80 dark:text-kova-400/80 mt-1" x-text="'Stall look: ' + (brandLock.surface_vibe || '')"></p>
                <p x-show="brandLock.scene_pack" class="text-[10px] text-kova-600/90 dark:text-kova-400/90 mt-0.5" x-text="'Scene pack: ' + (brandLock.scene_pack || '').replace(/_/g, ' ')"></p>
              </div>
              <span x-show="heroSaving" class="text-[10px] text-kova-600 animate-pulse shrink-0">Saving…</span>
            </div>

            <div class="space-y-4 max-h-72 overflow-y-auto">
              <template x-for="item in heroPickerItems" :key="item.product_id">
                <div class="rounded-lg border border-kova-100 dark:border-kova-900 bg-white/70 dark:bg-gray-900/40 p-3">
                  <p class="text-sm font-medium text-gray-900 dark:text-white mb-2 truncate" x-text="item.product_name"></p>
                  <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
                    <template x-for="scene in item.gallery_scenes" :key="scene.url">
                      <div class="relative rounded-lg overflow-hidden border aspect-square"
                           :class="scene.is_hero ? 'border-kova-500 ring-2 ring-kova-400/50' : 'border-gray-200 dark:border-gray-700'">
                        <img :src="scene.url" :alt="scene.label" class="w-full h-full object-cover">
                        <div class="absolute inset-x-0 top-0 flex flex-wrap gap-0.5 p-1">
                          <span x-show="scene.is_hero" class="text-[8px] font-bold uppercase px-1 py-0.5 rounded bg-kova-600 text-white">Hero</span>
                          <span x-show="scene.is_original" class="text-[8px] font-bold uppercase px-1 py-0.5 rounded bg-black/60 text-white">Original</span>
                        </div>
                        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent p-1.5 pt-4">
                          <p class="text-[9px] text-white truncate mb-1" x-text="scene.label"></p>
                          <button type="button"
                                  x-show="!scene.is_hero"
                                  @click="setHero(item.product_id, scene.url)"
                                  :disabled="heroSaving"
                                  class="text-[9px] px-1.5 py-0.5 rounded bg-white/90 text-kova-800 font-semibold hover:bg-white disabled:opacity-50">
                            Set hero
                          </button>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <div class="px-5 py-4 border-t border-gray-100 dark:border-gray-800 flex flex-col sm:flex-row gap-2">
        <template x-if="status === 'completed'">
          <a x-show="shopUrl" :href="shopUrl" target="_blank" rel="noopener"
             class="flex-1 px-4 py-2.5 text-sm font-semibold rounded-lg bg-kova-600 text-white hover:bg-kova-700 text-center">
            View shop
          </a>
          <button type="button" @click="refreshPage()" class="flex-1 px-4 py-2.5 text-sm font-semibold rounded-lg bg-kova-700 text-white hover:bg-kova-800">View catalog</button>
          <a :href="studioUrl" class="px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600 text-center">Studio</a>
          <button type="button" @click="close()" class="px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600">Close</button>
        </template>
        <template x-if="processing">
          <button type="button" @click="close()" class="w-full px-4 py-2 text-sm text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
            Run in background — products appear in your catalog when ready
          </button>
        </template>
        <template x-if="status === 'failed'">
          <button type="button" @click="close()" class="w-full px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600">Close</button>
        </template>
      </div>
    </div>
  </div>
</div>

<script>
function batchSnapPipelineModal(productIdsCsv, sessionId) {
  return {
    open: true,
    productIds: productIdsCsv,
    sessionId: sessionId || '',
    status: 'processing',
    steps: [],
    items: [],
    totalCount: 0,
    completedCount: 0,
    errorMessage: '',
    progressPercent: 5,
    studioUrl: '/content/studio/',
    shopUrl: '',
    stallTitle: '',
    brandLock: {},
    heroSaving: false,
    pollTimer: null,
    get processing() { return this.status === 'processing'; },
    get heroPickerItems() {
      return (this.items || []).filter(i => i.hero_picker_ready && (i.gallery_scenes || []).length);
    },
    get headerTitle() {
      if (this.status === 'completed') return this.stallTitle ? `${this.stallTitle} is live` : 'Your stall is open';
      if (this.status === 'failed') return 'Some items failed';
      return 'Opening your stall…';
    },
    get headerSubtitle() {
      if (this.status === 'completed') return 'Shop updated · balanced studio packs · posts, carousels & reel drafted.';
      if (this.status === 'failed') return 'Check the catalog for items that completed.';
      return 'Naming each photo, polishing a balanced studio pack, then drafting your market-day campaign.';
    },
    init() {
      this.poll();
      this.pollTimer = setInterval(() => this.poll(), 2000);
    },
    close() {
      this.open = false;
      if (this.pollTimer) clearInterval(this.pollTimer);
      const url = new URL(window.location.href);
      url.searchParams.delete('batch');
      url.searchParams.delete('session');
      window.history.replaceState({}, '', url);
    },
    refreshPage() {
      this.close();
      window.location.reload();
    },
    async poll() {
      if (!this.productIds) return;
      try {
        let fetchUrl = `/products/snap/batch/status/?ids=${encodeURIComponent(this.productIds)}`;
        if (this.sessionId) fetchUrl += `&session=${encodeURIComponent(this.sessionId)}`;
        const resp = await fetch(fetchUrl, {
          headers: { 'Accept': 'application/json' },
          credentials: 'same-origin',
        });
        if (!resp.ok) return;
        const data = await resp.json();
        this.status = data.status;
        this.steps = data.steps || [];
        this.items = data.items || [];
        this.totalCount = data.total_count || 0;
        this.completedCount = data.completed_count || 0;
        this.errorMessage = data.error_message || '';
        this.progressPercent = data.progress_percent || 10;
        this.studioUrl = data.studio_url || '/content/studio/';
        this.shopUrl = data.shop_url || '';
        this.stallTitle = data.stall_title || '';
        this.brandLock = data.brand_lock || {};
        if (data.terminal && this.pollTimer) {
          clearInterval(this.pollTimer);
          this.pollTimer = null;
        }
      } catch (e) {
        console.warn('Batch snap pipeline poll failed', e);
      }
    },
    csrfToken() {
      return document.querySelector('[name=csrfmiddlewaretoken]')?.value
        || document.cookie.split('; ').find(r => r.startsWith('csrftoken='))?.split('=')[1]
        || '';
    },
    async setHero(productId, imageUrl) {
      if (!productId || !imageUrl || this.heroSaving) return;
      this.heroSaving = true;
      try {
        const resp = await fetch(`/products/${productId}/gallery-hero/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Accept': 'application/json',
            'X-CSRFToken': this.csrfToken(),
            'X-Requested-With': 'XMLHttpRequest',
          },
          body: new URLSearchParams({ image_url: imageUrl }),
          credentials: 'same-origin',
        });
        if (resp.ok) {
          await this.poll();
        }
      } catch (e) {
        console.warn('Set hero failed', e);
      } finally {
        this.heroSaving = false;
      }
    },
  };
}
</script>
{% endif %}
