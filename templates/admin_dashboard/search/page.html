{% extends "admin_dashboard/base.html" %}

{% block page_title %}Search{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <form method="get" action="{% url 'admin_dashboard:global_search' %}" class="mb-6">
    <label for="admin-search-page-q" class="sr-only">Search</label>
    <div class="flex gap-2">
      <input id="admin-search-page-q" type="search" name="q" value="{{ q }}"
             placeholder="Users, posts, leads, products, agency sales…"
             autocomplete="off"
             class="flex-1 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 px-4 py-2.5 text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-kova-500 focus:border-kova-500" />
      <button type="submit" class="px-4 py-2 text-sm font-medium rounded-lg bg-kova-600 text-white hover:bg-kova-700">Search</button>
    </div>
    <label class="mt-2 flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
      <input type="checkbox" name="interpret" value="1" {% if request.GET.interpret %}checked{% endif %} class="rounded border-gray-300 dark:border-gray-600" />
      AI summary (uses OpenRouter when configured)
    </label>
  </form>

  <div class="rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shadow-sm overflow-hidden">
    {% include "admin_dashboard/search/_results.html" %}
  </div>
</div>
{% endblock %}
