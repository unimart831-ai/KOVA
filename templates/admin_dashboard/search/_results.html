{% if not q or q|length < min_len %}
  <p class="px-3 py-4 text-xs text-gray-500 dark:text-gray-400">Type at least {{ min_len }} characters to search users, posts, leads, products, and more.</p>
{% elif not groups %}
  <p class="px-3 py-4 text-xs text-gray-500 dark:text-gray-400">No results for “{{ q }}”.</p>
{% else %}
  {% if ai_hint %}
    <p class="px-3 py-2 text-xs text-kova-700 dark:text-kova-300 bg-kova-50 dark:bg-kova-900/20 border-b border-gray-100 dark:border-gray-800">{{ ai_hint }}</p>
  {% endif %}
  <div class="max-h-[min(70vh,28rem)] overflow-y-auto divide-y divide-gray-100 dark:divide-gray-800">
    {% include "admin_dashboard/search/_hits.html" %}
  </div>
{% endif %}
