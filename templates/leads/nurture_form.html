{% extends "layouts/app.html" %}

{% block page_title %}{% if is_edit %}Edit Sequence{% else %}New Nurture Sequence{% endif %}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto" x-data="nurture()">

  <form method="post" class="space-y-6">
    {% csrf_token %}

    {# Sequence basics #}
    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl p-5 space-y-4">
      <h3 class="text-sm font-semibold text-gray-900 dark:text-white">Sequence Details</h3>

      <div>
        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Sequence Name</label>
        <input type="text" name="name" value="{{ name|default:'' }}" required
               class="block w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800 text-sm"
               placeholder="e.g. New Lead Welcome">
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Trigger — when should leads enter this sequence?</label>
        <select name="trigger" class="block w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800 text-sm"
                x-model="trigger">
          <option value="all_new">All new leads</option>
          <option value="from_form">Leads from form submissions</option>
          <option value="from_social">Leads from social (DMs & comments)</option>
          <option value="high_priority">High-priority leads only</option>
          <option value="from_platform">From specific platform</option>
          <option value="manual">Manual enrollment only</option>
        </select>
      </div>

      <div x-show="trigger === 'from_platform'" x-cloak>
        <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Platform</label>
        <input type="text" name="trigger_platform" value="{{ trigger_platform|default:'' }}"
               class="block w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800 text-sm"
               placeholder="e.g. instagram, linkedin">
      </div>
    </div>

    {# Steps #}
    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-gray-900 dark:text-white">Steps</h3>
        <button type="button" @click="addStep()"
                class="text-xs px-3 py-1.5 rounded-lg bg-kova-600 text-white hover:bg-kova-700">
          + Add Step
        </button>
      </div>

      <template x-for="(step, index) in steps" :key="index">
        <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-gray-500 dark:text-gray-400" x-text="'Step ' + (index + 1)"></span>
            <button type="button" @click="removeStep(index)" x-show="steps.length > 1"
                    class="text-xs text-red-500 hover:text-red-700">&times; Remove</button>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Delay (hours after previous)</label>
              <input type="number" :name="'step_' + index + '_delay'" x-model="step.delay" min="0"
                     class="block w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-900 text-sm"
                     placeholder="e.g. 1 = 1 hour, 24 = 1 day">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Action</label>
              <select :name="'step_' + index + '_action'" x-model="step.action"
                      class="block w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-900 text-sm">
                <option value="send_email">Send Email</option>
                {% if whatsapp_enabled %}<option value="send_whatsapp">Send WhatsApp</option>{% endif %}
                <option value="add_tag">Add Tag</option>
                <option value="change_status">Change Status</option>
              </select>
            </div>
          </div>

          {# WhatsApp message (Pro+ with WhatsApp connected) #}
          <div x-show="step.action === 'send_whatsapp'" x-cloak class="space-y-3">
            <p class="text-[11px] text-gray-500 dark:text-gray-400">Sent when the lead has a phone number; falls back to email otherwise.</p>
            <div>
              <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">WhatsApp Message</label>
              <textarea :name="'step_' + index + '_body'" x-model="step.body" rows="4"
                        class="block w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-900 text-sm"
                        placeholder="Hi {{name}}! Thanks for reaching out…"></textarea>
            </div>
          </div>

          {# Email fields #}
          <div x-show="step.action === 'send_email'" x-cloak class="space-y-3">
            <div>
              <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Email Subject</label>
              <input type="text" :name="'step_' + index + '_subject'" x-model="step.subject"
                     class="block w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-900 text-sm"
                     placeholder="e.g. Thanks for reaching out!">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Email Body</label>
              <textarea :name="'step_' + index + '_body'" x-model="step.body" rows="4"
                        class="block w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-900 text-sm"
                        placeholder="Hi there! Thanks for your interest..."></textarea>
            </div>
          </div>

          {# Tag field #}
          <div x-show="step.action === 'add_tag'" x-cloak>
            <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Tag to Add</label>
            <input type="text" :name="'step_' + index + '_tag'" x-model="step.tag"
                   class="block w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-900 text-sm"
                   placeholder="e.g. nurtured, interested">
          </div>

          {# Status field #}
          <div x-show="step.action === 'change_status'" x-cloak>
            <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">New Status</label>
            <select :name="'step_' + index + '_status'" x-model="step.status_val"
                    class="block w-full rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-900 text-sm">
              <option value="contacted">Contacted</option>
              <option value="qualified">Qualified</option>
            </select>
          </div>
        </div>
      </template>

      {# Hidden count #}
      <input type="hidden" name="step_count" :value="steps.length">
    </div>

    <div class="flex items-center justify-end gap-3">
      <a href="{% url 'leads:nurture_list' %}" class="btn-secondary text-sm px-4 py-2">Cancel</a>
      <button type="submit" class="btn-primary text-sm px-6 py-2">
        {% if is_edit %}Save Changes{% else %}Create Sequence{% endif %}
      </button>
    </div>
  </form>

</div>

<script>
function nurture() {
  return {
    trigger: '{{ trigger|default:"all_new" }}',
    steps: {{ steps_json|default:"[{delay: 1, action: 'send_email', subject: '', body: '', tag: '', status_val: 'contacted'}]"|safe }},
    addStep() {
      this.steps.push({delay: 24, action: 'send_email', subject: '', body: '', tag: '', status_val: 'contacted'});
    },
    removeStep(index) {
      this.steps.splice(index, 1);
    }
  }
}
</script>
{% endblock %}
