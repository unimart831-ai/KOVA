<span class="text-[10px] px-2 py-0.5 rounded-full font-medium
  {% if lead.status == 'new' %}bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300
  {% elif lead.status == 'contacted' %}bg-kova-100 text-kova-700 dark:bg-kova-950 dark:text-kova-300
  {% elif lead.status == 'qualified' %}bg-gold-100 text-gold-700 dark:bg-gold-950 dark:text-gold-300
  {% elif lead.status == 'converted' %}bg-growth-100 text-growth-700 dark:bg-growth-950 dark:text-growth-300
  {% else %}bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-400{% endif %}">
  {{ lead.get_status_display }}
</span>
