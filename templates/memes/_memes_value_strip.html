{% if value_stats %}
<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-3 text-center">
    <div class="text-xl font-bold text-kova-600">{{ value_stats.month_adapted }}</div>
    <div class="text-[10px] text-gray-500 uppercase tracking-wider">Adapted this month</div>
  </div>
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-3 text-center">
    <div class="text-xl font-bold text-green-600">{{ value_stats.published }}</div>
    <div class="text-[10px] text-gray-500 uppercase tracking-wider">Published</div>
  </div>
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-3 text-center">
    <div class="text-xl font-bold text-rose-600">{{ value_stats.pending_alerts }}</div>
    <div class="text-[10px] text-gray-500 uppercase tracking-wider">Trend alerts</div>
  </div>
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-3 text-center">
    <div class="text-xl font-bold text-gray-900 dark:text-white">~{{ value_stats.minutes_saved }}m</div>
    <div class="text-[10px] text-gray-500 uppercase tracking-wider">Time saved (est.)</div>
  </div>
</div>
{% endif %}
