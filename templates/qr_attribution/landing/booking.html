{% extends "qr_attribution/landing/_base.html" %}
{% block content %}
  <h1>Book an appointment</h1>
  <p class="body-text">Pick a time that works for you. Confirmation comes via WhatsApp.</p>
  {% if payload.booking_link %}
    <a href="{{ payload.booking_link }}" class="cta">Book now →</a>
  {% endif %}
  {% if payload.contact_whatsapp %}
    <a href="https://wa.me/{{ payload.contact_whatsapp }}" class="cta cta-secondary">Or message us on WhatsApp</a>
  {% endif %}
{% endblock %}
