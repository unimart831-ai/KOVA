{% extends "layouts/app.html" %}

{% block page_title %}Create Team{% endblock %}
{% block page_subtitle %}
  <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5 hidden sm:block">
    <a href="{% url 'teams:list' %}" class="hover:text-kova-600 dark:hover:text-kova-400">Teams</a>
    <span class="mx-1">/</span> New Team
  </p>
{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <form method="post" class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl p-6">
    {% csrf_token %}

    <div class="mb-5">
      <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Team Name</label>
      <input type="text" name="name" id="name" required autofocus
             placeholder="e.g. Marketing Team"
             class="w-full px-3 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-kova-500 focus:border-transparent">
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">This will be visible to all team members.</p>
    </div>

    <div class="flex items-center gap-3">
      <button type="submit"
              class="px-4 py-2 bg-kova-600 hover:bg-kova-700 text-white text-sm font-medium rounded-lg transition-colors">
        Create Team
      </button>
      <a href="{% url 'teams:list' %}" class="text-sm text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
