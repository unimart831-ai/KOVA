{# Filter bar + posts-to-review — shared by approve-first and default Studio layouts #}
<div class="flex flex-wrap items-center gap-3 px-1">
  <form method="get" action="{% url 'content:studio' %}" class="flex flex-wrap items-center gap-2 w-full sm:w-auto" id="studio-filter-form">
    <input type="hidden" name="source" value="{{ current_source }}">
    <div class="relative flex-1 sm:flex-initial sm:w-56">
      <input type="text" name="q" value="{{ current_search }}" placeholder="Search posts…"
             class="input text-xs pl-8 h-8 w-full"
             hx-get="{% url 'content:studio_posts' %}" hx-trigger="keyup changed delay:300ms"
             hx-target="#studio-posts-section" hx-swap="innerHTML"
             hx-include="#studio-filter-form">
      <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </div>
    <select name="status" class="input text-xs h-8 w-auto"
            hx-get="{% url 'content:studio_posts' %}" hx-trigger="change"
            hx-target="#studio-posts-section" hx-swap="innerHTML"
            hx-include="#studio-filter-form">
      <option value="">All statuses</option>
      <option value="draft" {% if current_status == 'draft' %}selected{% endif %}>Draft</option>
      <option value="pending_approval" {% if current_status == 'pending_approval' %}selected{% endif %}>Pending</option>
      <option value="approved" {% if current_status == 'approved' %}selected{% endif %}>Approved</option>
      <option value="scheduled" {% if current_status == 'scheduled' %}selected{% endif %}>Scheduled</option>
      <option value="published" {% if current_status == 'published' %}selected{% endif %}>Published</option>
      <option value="rejected" {% if current_status == 'rejected' %}selected{% endif %}>Rejected</option>
      <option value="failed" {% if current_status == 'failed' %}selected{% endif %}>Failed</option>
    </select>
    <select name="platform" class="input text-xs h-8 w-auto"
            hx-get="{% url 'content:studio_posts' %}" hx-trigger="change"
            hx-target="#studio-posts-section" hx-swap="innerHTML"
            hx-include="#studio-filter-form">
      <option value="">All platforms</option>
      <option value="instagram" {% if current_platform == 'instagram' %}selected{% endif %}>Instagram</option>
      <option value="facebook" {% if current_platform == 'facebook' %}selected{% endif %}>Facebook</option>
      <option value="tiktok" {% if current_platform == 'tiktok' %}selected{% endif %}>TikTok</option>
      <option value="linkedin" {% if current_platform == 'linkedin' %}selected{% endif %}>LinkedIn</option>
      <option value="whatsapp" {% if current_platform == 'whatsapp' %}selected{% endif %}>WhatsApp</option>
    </select>
    <select name="post_format" class="input text-xs h-8 w-auto"
            hx-get="{% url 'content:studio_posts' %}" hx-trigger="change"
            hx-target="#studio-posts-section" hx-swap="innerHTML"
            hx-include="#studio-filter-form">
      <option value="">All formats</option>
      <option value="text" {% if current_format == 'text' %}selected{% endif %}>Text</option>
      <option value="image" {% if current_format == 'image' %}selected{% endif %}>Image</option>
      <option value="carousel" {% if current_format == 'carousel' %}selected{% endif %}>Carousel</option>
      <option value="story" {% if current_format == 'story' %}selected{% endif %}>Story</option>
      <option value="reel" {% if current_format == 'reel' %}selected{% endif %}>Reel</option>
      <option value="video" {% if current_format == 'video' %}selected{% endif %}>Video</option>
    </select>
  </form>

  {% if not is_starter_plan %}
  <a href="{% if current_source == 'holiday' %}{% url 'content:studio' %}{% else %}{% url 'content:studio' %}?source=holiday{% endif %}"
     class="inline-flex items-center gap-1.5 h-8 px-3 text-xs font-medium rounded-md border transition-colors
       {% if current_source == 'holiday' %}
         bg-kova-600 text-white border-kova-600 hover:bg-kova-700
       {% else %}
         bg-white dark:bg-gray-900 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-700 hover:bg-kova-50 dark:hover:bg-kova-950/40 hover:text-kova-700 dark:hover:text-kova-300 hover:border-kova-300 dark:hover:border-kova-700
       {% endif %}">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    Holiday drafts
  </a>
  {% endif %}
</div>

<div id="studio-posts-section"
     hx-get="{% url 'content:studio_posts' %}{% if current_status %}?status={{ current_status }}{% endif %}"
     hx-trigger="refreshStudioPosts from:body"
     hx-swap="innerHTML">
  {% include "content/_studio_posts.html" %}
</div>
