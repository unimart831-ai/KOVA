{# Inline processing card — returned by HTMX after seed submission #}
<div hx-get="{% url 'content:seed_status' seed.id %}"
     hx-trigger="every 2s"
     hx-swap="outerHTML"
     class="card border-l-4 border-l-kova-400 dark:border-l-kova-500 animate-fade-in">
  <div class="card-body flex items-center gap-4">
    <div class="animate-spin rounded-full h-6 w-6 border-2 border-kova-400 border-t-transparent shrink-0" aria-hidden="true"></div>
    <div class="min-w-0">
      <p class="text-sm font-medium text-gray-900 dark:text-white">Generating posts…</p>
      <p class="text-xs text-gray-500 dark:text-gray-400 truncate">{{ seed.idea|truncatewords:15 }}</p>
    </div>
  </div>
</div>
