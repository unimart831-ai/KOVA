{# Live Create Agent generation modal — opens when ?generating=<uuid> #}
{% if generating_seed_id %}
<div x-data="studioGenerationModal('{{ generating_seed_id }}')"
     x-init="init()"
     x-cloak>
  <div x-show="open"
       class="fixed inset-0 z-[9999] flex items-center justify-center p-4"
       role="dialog"
       aria-modal="true"
       aria-labelledby="studio-generation-title">
    <div class="absolute inset-0 bg-gray-950/70 backdrop-blur-sm" @click="close()"></div>

    <div class="relative w-full max-w-lg max-h-[90vh] overflow-hidden rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 shadow-2xl flex flex-col">
      <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800 bg-kova-600 dark:bg-kova-700">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="text-[10px] font-semibold text-white/70 uppercase tracking-wider">Campaign Studio</p>
            <h2 id="studio-generation-title" class="text-lg font-bold text-white mt-0.5" x-text="headerTitle"></h2>
            <p class="text-xs text-white/80 mt-1" x-text="headerSubtitle"></p>
          </div>
          <button type="button" @click="close()" class="text-white/70 hover:text-white p-1 shrink-0" aria-label="Close">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-5 space-y-4">
        <template x-if="processing">
          <div>
            <div class="h-1.5 bg-gray-100 dark:bg-gray-800 rounded-full overflow-hidden">
              <div class="h-full bg-kova-500 rounded-full transition-all duration-700"
                   :style="'width:' + progressPercent + '%'"></div>
            </div>
            <p class="text-[10px] text-gray-400 mt-1.5 text-center">Create Agent at work — usually 30–90 seconds</p>
          </div>
        </template>

        <div x-show="idea" class="p-3 rounded-lg bg-gray-50 dark:bg-gray-800/60 border border-gray-100 dark:border-gray-700">
          <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Your idea</p>
          <p class="text-sm text-gray-800 dark:text-gray-200 mt-1 italic" x-text="'“' + idea + '”'"></p>
        </div>

        <div>
          <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Thought process</h3>
          <ul class="space-y-2">
            <template x-for="(entry, idx) in log" :key="idx">
              <li class="flex gap-3 text-sm">
                <span class="flex-shrink-0 mt-0.5">
                  <template x-if="idx < log.length - 1 || !processing">
                    <svg class="w-4 h-4 text-growth-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                  </template>
                  <template x-if="idx === log.length - 1 && processing">
                    <span class="block w-4 h-4 border-2 border-kova-500 border-t-transparent rounded-full animate-spin"></span>
                  </template>
                </span>
                <div class="min-w-0">
                  <p class="text-gray-900 dark:text-white font-medium" x-text="entry.message"></p>
                  <p x-show="entry.detail" class="text-xs text-gray-500 dark:text-gray-400 mt-0.5" x-text="entry.detail"></p>
                </div>
              </li>
            </template>
            <template x-if="log.length === 0">
              <li class="flex items-center gap-3 text-sm text-gray-500">
                <span class="w-4 h-4 border-2 border-kova-500 border-t-transparent rounded-full animate-spin"></span>
                Starting Create Agent…
              </li>
            </template>
          </ul>
        </div>

        <template x-if="status === 'completed' && batchStrategy">
          <div class="bg-kova-50 dark:bg-kova-950/30 rounded-xl p-4 border border-kova-200 dark:border-kova-800">
            <p class="text-[10px] font-semibold text-kova-600 dark:text-kova-400 uppercase tracking-wider">Content strategy</p>
            <p class="text-sm text-kova-900 dark:text-kova-100 mt-1" x-text="batchStrategy"></p>
          </div>
        </template>

        <template x-if="status === 'completed' && posts.length">
          <div>
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
              <span x-text="posts.length"></span> posts generated
            </p>
            <ul class="space-y-2 max-h-48 overflow-y-auto">
              <template x-for="(post, i) in posts" :key="post.id || i">
                <li class="p-3 rounded-lg bg-gray-50 dark:bg-gray-800/80 border border-gray-100 dark:border-gray-700">
                  <div class="flex items-center justify-between gap-2">
                    <p class="text-xs font-medium text-gray-500" x-text="post.platform"></p>
                    <span x-show="post.post_format === 'reel' && post.reel_compose_pending" class="text-[9px] text-orange-600 dark:text-orange-400">Composing reel…</span>
                    <span x-show="post.post_format === 'reel' && post.reel_has_video" class="text-[9px] text-growth-600 dark:text-growth-400">Motion reel ready</span>
                    <span x-show="post.post_format === 'reel' && !post.reel_compose_pending && !post.reel_has_video && post.media_status === 'pending'" class="text-[9px] text-gold-600 dark:text-gold-400">Creating frame…</span>
                    <span x-show="post.post_format !== 'reel' && post.media_status === 'pending'" class="text-[9px] text-gold-600 dark:text-gold-400">Image generating</span>
                    <span x-show="post.post_format !== 'reel' && post.media_status === 'generated'" class="text-[9px] text-growth-600 dark:text-growth-400">AI image</span>
                  </div>
                  <p x-show="post.angle" class="text-[10px] text-kova-500 dark:text-kova-400 mt-0.5" x-text="post.angle"></p>
                  <p class="text-sm text-gray-900 dark:text-white mt-1 line-clamp-2" x-text="post.preview"></p>
                </li>
              </template>
            </ul>
          </div>
        </template>

        <template x-if="status === 'completed' && autoApprovePosts && pendingCount === 0">
          <div class="bg-gold-50 dark:bg-gold-950/30 border border-gold-200 dark:border-gold-800 rounded-xl p-4">
            <p class="text-sm font-medium text-gold-900 dark:text-gold-200">Auto-approve is on</p>
            <p class="text-xs text-gold-800 dark:text-gold-300 mt-1">Posts skip Studio review and go straight to your Queue. Turn off auto-approve in Settings if you want to review here first.</p>
          </div>
        </template>

        <template x-if="status === 'failed'">
          <div class="bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-800 rounded-xl p-4">
            <p class="text-sm font-medium text-red-800 dark:text-red-200">Generation failed</p>
            <p class="text-xs text-red-700 dark:text-red-300 mt-1" x-text="errorMessage || 'Something went wrong. Try again.'"></p>
          </div>
        </template>
      </div>

      <div class="px-5 py-4 border-t border-gray-100 dark:border-gray-800 flex flex-col sm:flex-row gap-2">
        <template x-if="status === 'completed' && pendingCount > 0">
          <button type="button" @click="scrollToPosts()"
                  class="flex-1 px-4 py-2.5 text-sm font-semibold rounded-lg bg-kova-600 text-white hover:bg-kova-700">
            Review posts below
          </button>
          <button type="button" @click="close()"
                  class="px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300">
            Close
          </button>
        </template>
        <template x-if="status === 'completed' && pendingCount === 0 && autoApprovePosts">
          <a :href="queueUrl"
             class="flex-1 text-center px-4 py-2.5 text-sm font-semibold rounded-lg bg-kova-600 text-white hover:bg-kova-700">
            View in Queue
          </a>
          <button type="button" @click="close()"
                  class="px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300">
            Close
          </button>
        </template>
        <template x-if="status === 'completed' && pendingCount === 0 && !autoApprovePosts">
          <button type="button" @click="close()"
                  class="w-full px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600">
            Close
          </button>
        </template>
        <template x-if="processing">
          <button type="button" @click="close()"
                  class="w-full px-4 py-2 text-sm text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
            Run in background — posts appear below when ready
          </button>
        </template>
        <template x-if="status === 'failed'">
          <button type="button" @click="close()"
                  class="w-full px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600">
            Close
          </button>
        </template>
      </div>
    </div>
  </div>
</div>

<script>
function studioGenerationModal(seedId) {
  return {
    open: true,
    seedId: seedId,
    status: 'new',
    log: [],
    idea: '',
    batchStrategy: '',
    posts: [],
    errorMessage: '',
    pendingCount: 0,
    autoApprovePosts: false,
    queueUrl: '/content/queue/',
    pollTimer: null,
    get processing() {
      return this.status === 'new' || this.status === 'processing';
    },
    get headerTitle() {
      if (this.status === 'completed' && this.autoApprovePosts && this.pendingCount === 0) return 'Posts auto-approved';
      if (this.status === 'completed') return 'Your campaign is ready';
      if (this.status === 'failed') return 'Campaign build interrupted';
      return 'Kova is building your campaign';
    },
    get headerSubtitle() {
      if (this.status === 'completed' && this.autoApprovePosts && this.pendingCount === 0) {
        return 'Auto-approve is on — find them in Queue, not Posts to review.';
      }
      if (this.status === 'completed') return 'Reel, carousel & posts for each platform — review and approve below.';
      if (this.status === 'failed') return 'Fix the issue and try again or pick another angle.';
      return 'Professional visuals + platform posts + commerce page. Nothing publishes until you approve.';
    },
    get progressPercent() {
      const steps = ['queued', 'brand', 'platforms', 'writing', 'strategy', 'complete'];
      const done = this.log.map(e => e.step).filter(s => steps.includes(s) || s.startsWith('draft_'));
      return Math.min(95, Math.round((done.length / Math.max(steps.length + 2, 6)) * 100));
    },
    init() {
      this.poll();
      this.pollTimer = setInterval(() => this.poll(), 2000);
    },
    close() {
      this.open = false;
      if (this.pollTimer) clearInterval(this.pollTimer);
      const url = new URL(window.location.href);
      url.searchParams.delete('generating');
      window.history.replaceState({}, '', url);
    },
    scrollToPosts() {
      this.close();
      const el = document.getElementById('studio-posts-section');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    },
    async poll() {
      if (!this.seedId) return;
      try {
        const resp = await fetch(`/content/studio/seed/${this.seedId}/generation-status/`, {
          headers: { 'Accept': 'application/json' },
          credentials: 'same-origin',
        });
        if (!resp.ok) return;
        const data = await resp.json();
        this.status = data.status;
        this.log = data.generation_log || [];
        this.idea = data.idea || '';
        this.batchStrategy = data.batch_strategy || '';
        this.posts = data.posts || [];
        this.errorMessage = data.error_message || '';
        this.pendingCount = data.pending_count || 0;
        this.autoApprovePosts = !!data.auto_approve_posts;
        this.queueUrl = data.queue_url || '/content/queue/';
        if (data.terminal) {
          if (this.pollTimer) {
            clearInterval(this.pollTimer);
            this.pollTimer = null;
          }
          if (data.status === 'completed') {
            if (typeof refreshStudioPostsSection === 'function') {
              refreshStudioPostsSection();
            } else {
              document.body.dispatchEvent(new CustomEvent('refreshStudioPosts', { bubbles: true }));
            }
          }
        }
      } catch (e) {
        console.warn('Studio generation poll failed', e);
      }
    },
  };
}
</script>
{% endif %}
