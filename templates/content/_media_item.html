{% comment %}
Single media attachment thumbnail with delete action.
{% endcomment %}
<div class="relative group" id="media-{{ attachment.id }}">
  <img src="{{ attachment.file.url }}" alt="{{ attachment.alt_text }}" loading="lazy"
       class="w-full aspect-square object-cover rounded-lg">
  {% if attachment.alt_text %}
    <div class="absolute inset-x-0 bottom-0 bg-black/50 text-white text-[10px] p-1 rounded-b-lg opacity-0 group-hover:opacity-100 transition-opacity">
      {{ attachment.alt_text|truncatewords:5 }}
    </div>
  {% endif %}
  <button hx-delete="{% url 'content:delete_media' attachment.post_id attachment.id %}"
          hx-target="#media-{{ attachment.id }}"
          hx-swap="outerHTML"
          hx-confirm="Remove this image?"
          class="absolute top-1 right-1 p-1 bg-black/60 hover:bg-red-600 text-white rounded-full opacity-0 group-hover:opacity-100 transition-all"
          title="Remove image">
    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
  </button>
</div>
