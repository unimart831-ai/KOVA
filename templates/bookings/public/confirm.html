<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booked · {{ link.label }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: #f9fafb; min-height: 100vh; color: #111; padding: 24px; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border: 2px solid #d1fae5; border-radius: 16px; padding: 32px 24px; max-width: 420px; text-align: center; }
    .check { width: 56px; height: 56px; border-radius: 50%; background: #2dd4a4; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 14px; margin-bottom: 4px; }
    dl { text-align: left; margin: 24px 0 8px; padding-top: 16px; border-top: 1px solid #f3f4f6; font-size: 14px; }
    dt { color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 12px; }
    dd { color: #111; font-weight: 500; margin-top: 2px; }
    .footer { font-size: 11px; color: #9ca3af; margin-top: 24px; }
  </style>
</head>
<body>
<div class="card">
  <div class="check">✓</div>
  <h1>You're booked!</h1>
  <p>A confirmation will arrive via WhatsApp shortly.</p>
  <dl>
    <dt>When</dt><dd>{{ booking.scheduled_at|date:"l M j · H:i" }}</dd>
    <dt>Service</dt><dd>{{ booking.service_name }}{% if booking.price_kes %} · KES {{ booking.price_kes|floatformat:0 }}{% endif %}</dd>
    <dt>Name</dt><dd>{{ booking.customer_name }}</dd>
  </dl>
  <p class="footer">Powered by Kova</p>
</div>
</body>
</html>
