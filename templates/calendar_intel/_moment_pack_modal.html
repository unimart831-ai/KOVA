{# Moment Mode — HolidayDraft pack modal on Brief home #}
{% if moment_pack_id %}
<div x-data="momentPackModal('{{ moment_pack_id|escapejs }}')"
     x-init="init()"
     x-cloak>
  <div x-show="open"
       class="fixed inset-0 z-[9999] flex items-center justify-center p-4"
       role="dialog"
       aria-modal="true"
       aria-labelledby="moment-pack-title">
    <div class="absolute inset-0 bg-gray-950/70 backdrop-blur-sm" @click="close()"></div>

    <div class="relative w-full max-w-lg max-h-[90vh] overflow-hidden rounded-2xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 shadow-2xl flex flex-col">
      <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800 bg-gradient-to-r from-kova-600 to-indigo-600">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="text-[10px] font-semibold text-white/70 uppercase tracking-wider">Moment Mode</p>
            <h2 id="moment-pack-title" class="text-lg font-bold text-white mt-0.5" x-text="momentName || 'Cultural moment'"></h2>
            <p class="text-xs text-white/80 mt-1" x-text="headerSubtitle"></p>
          </div>
          <button type="button" @click="close()" class="text-white/70 hover:text-white p-1 shrink-0" aria-label="Close">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-5 space-y-4">
        <template x-if="processing">
          <div>
            <div class="h-1.5 bg-gray-100 dark:bg-gray-800 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-kova-500 to-indigo-500 rounded-full transition-all duration-700"
                   :style="'width:' + progressPercent + '%'"></div>
            </div>
            <p class="text-[10px] text-gray-400 mt-1.5 text-center">Building your moment pack…</p>
          </div>
        </template>

        <ul class="space-y-2">
          <template x-for="step in steps" :key="step.id">
            <li class="flex gap-3 text-sm rounded-lg p-2.5 border border-gray-100 dark:border-gray-800">
              <span class="flex-shrink-0 mt-0.5">
                <template x-if="step.status === 'completed'">
                  <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                </template>
                <template x-if="step.status === 'running'">
                  <span class="block w-4 h-4 border-2 border-kova-500 border-t-transparent rounded-full animate-spin"></span>
                </template>
                <template x-if="step.status === 'pending'">
                  <span class="block w-4 h-4 rounded-full border-2 border-gray-300"></span>
                </template>
              </span>
              <div>
                <p class="font-medium text-gray-900 dark:text-white" x-text="step.message"></p>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5" x-text="step.detail"></p>
              </div>
            </li>
          </template>
        </ul>

        <div x-show="posts.length">
          <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Draft posts</h3>
          <ul class="space-y-2 max-h-48 overflow-y-auto">
            <template x-for="post in posts" :key="post.post_id">
              <li class="p-3 rounded-lg border border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-800/30">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-[10px] font-bold uppercase text-kova-600 dark:text-kova-400" x-text="post.platform"></span>
                  <span x-show="post.status === 'completed'" class="text-[9px] text-emerald-600">Approved</span>
                  <span x-show="post.status === 'pending'" class="text-[9px] text-amber-600">Waiting</span>
                </div>
                <p class="text-xs text-gray-600 dark:text-gray-400 line-clamp-2" x-text="post.preview"></p>
              </li>
            </template>
          </ul>
        </div>

        <template x-if="status === 'failed'">
          <div class="bg-red-50 dark:bg-red-950/30 border border-red-200 rounded-xl p-4">
            <p class="text-sm font-medium text-red-800 dark:text-red-200" x-text="errorMessage"></p>
          </div>
        </template>
      </div>

      <div class="px-5 py-4 border-t border-gray-100 dark:border-gray-800 flex flex-col sm:flex-row gap-2">
        <template x-if="status === 'ready'">
          <form method="post" :action="approveUrl" class="flex-1">
            {% csrf_token %}
            <input type="hidden" name="next" :value="returnUrl">
            <button type="submit" class="w-full px-4 py-2.5 text-sm font-semibold rounded-lg bg-kova-600 text-white hover:bg-kova-700">
              Approve pack &amp; schedule
            </button>
          </form>
          <form method="post" :action="dismissUrl">
            {% csrf_token %}
            <input type="hidden" name="next" :value="returnUrl">
            <button type="submit" class="px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600">Dismiss</button>
          </form>
          <a :href="studioUrl" class="px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600 text-center">Edit in Studio</a>
        </template>
        <template x-if="status === 'completed'">
          <button type="button" @click="refreshPage()" class="flex-1 px-4 py-2.5 text-sm font-semibold rounded-lg bg-kova-600 text-white hover:bg-kova-700">Done</button>
          <a :href="studioUrl" class="px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600 text-center">Studio</a>
        </template>
        <template x-if="processing">
          <button type="button" @click="close()" class="w-full px-4 py-2 text-sm text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
            Run in background — we'll notify you when drafts are ready
          </button>
        </template>
        <template x-if="status === 'dismissed' || status === 'failed'">
          <button type="button" @click="close()" class="w-full px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600">Close</button>
        </template>
      </div>
    </div>
  </div>
</div>

<script>
function momentPackModal(draftId) {
  return {
    open: true,
    draftId: draftId,
    status: 'processing',
    momentName: '',
    steps: [],
    posts: [],
    errorMessage: '',
    progressPercent: 10,
    studioUrl: '/content/studio/?source=holiday',
    approveUrl: '',
    dismissUrl: '',
    returnUrl: window.location.pathname + window.location.search,
    pollTimer: null,
    get processing() { return this.status === 'processing'; },
    get headerSubtitle() {
      if (this.status === 'ready') return 'Review AI drafts for this cultural moment.';
      if (this.status === 'completed') return 'Posts approved and queued.';
      if (this.status === 'dismissed') return 'Moment pack dismissed.';
      if (this.status === 'failed') return 'Generation failed.';
      return 'AI is drafting platform posts for this moment…';
    },
    init() {
      this.approveUrl = `/calendar/pack/${this.draftId}/approve/`;
      this.dismissUrl = `/calendar/pack/${this.draftId}/dismiss/`;
      this.poll();
      this.pollTimer = setInterval(() => this.poll(), 2500);
    },
    close() {
      this.open = false;
      if (this.pollTimer) clearInterval(this.pollTimer);
      const url = new URL(window.location.href);
      url.searchParams.delete('moment_pack');
      window.history.replaceState({}, '', url);
    },
    refreshPage() {
      this.close();
      window.location.reload();
    },
    async poll() {
      if (!this.draftId) return;
      try {
        const resp = await fetch(`/calendar/pack/${this.draftId}/status/`, {
          headers: { 'Accept': 'application/json' },
          credentials: 'same-origin',
        });
        if (!resp.ok) return;
        const data = await resp.json();
        this.status = data.status;
        this.momentName = data.moment_name || '';
        this.steps = data.steps || [];
        this.posts = data.posts || [];
        this.errorMessage = data.error_message || '';
        this.progressPercent = data.progress_percent || 10;
        this.studioUrl = data.studio_url || '/content/studio/?source=holiday';
        if (data.terminal && this.pollTimer) {
          clearInterval(this.pollTimer);
          this.pollTimer = null;
        }
      } catch (e) {
        console.warn('Moment pack poll failed', e);
      }
    },
  };
}
</script>
{% endif %}
