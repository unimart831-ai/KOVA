# Railway deploy config — https://docs.railway.com/reference/config-as-code
[build]
# Prefer Nixpacks so Procfile `web: bash start.sh` is used.
# Dockerfile also runs start.sh now; either path migrates before Daphne.
builder = "NIXPACKS"

[deploy]
# Runs once per deploy before new web instances receive traffic.
startCommand = "bash start.sh"
releaseCommand = "bash release.sh"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
