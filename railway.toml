# Railway deploy config — https://docs.railway.com/reference/config-as-code
[build]
builder = "NIXPACKS"

[deploy]
# Runs once per deploy before new web instances receive traffic.
releaseCommand = "bash release.sh"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
